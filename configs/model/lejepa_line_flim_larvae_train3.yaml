# LeJEPA Line — encoder_init: flim — helminth-larvae / split_3 (train3 weights).
model:
  class_path: src.modules.lejepa_line_module.LejepaLineModule
  init_args:
    arch_json: data/to_mateus/model/ch24_32_48_a0.5_f5/larvae/train3/architecture.json
    encoder_init: flim
    flim_weights_path: data/to_mateus/model/ch24_32_48_a0.5_f5/larvae/train3/models
    in_channels: 3
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05
    sigreg_type: real
    lr: 3.0e-3
    weight_decay: 5.0e-2
    warmup_epochs: 10
