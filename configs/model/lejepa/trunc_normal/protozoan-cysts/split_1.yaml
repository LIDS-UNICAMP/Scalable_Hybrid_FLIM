# LeJEPA Line — encoder_init: trunc_normal — protozoan-cysts / split_1
# Uses 30-channel conv2 architecture (matching FLIM kernel selection).
model:
  class_path: methods.lejepa.LejepaLineModule
  init_args:
    arch_json: data/to_mateus/model/ch24_30_48_a0.5_f5/protozoan/train1/architecture.json
    encoder_init: trunc_normal
    flim_weights_path: null
    in_channels: 3
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05
    sigreg_type: real
    lr: 5.0e-4
    weight_decay: 1.0e-5
    warmup_epochs: 10
