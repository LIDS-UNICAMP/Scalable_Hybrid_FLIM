# LeJEPA with ResNet-50 backbone (CNN instead of ViT).
# Drop-in replacement for lejepa.yaml — same training objective, different encoder.
# ResNet-50 is lighter and faster to train than vit_small_patch16_224.
# Pair with: configs/data/lejepa_multicrop.yaml
model:
  class_path: methods.lejepa.LeJEPAModule
  init_args:
    arch: resnet50
    pretrained: false
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05           # weight on SIGReg; (1 - lam) on invariance loss
    sigreg_type: simple # "simple" (faster) or "real" (Epps-Pulley)
    lr: 5.0e-4
    weight_decay: 5.0e-2
    warmup_epochs: 10
