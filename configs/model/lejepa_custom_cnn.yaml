# LeJEPA with custom lightweight CNN backbone (SimpleCNNModel).
# 3 Conv blocks (BN + ReLU + Dropout2d + MaxPool) + 3 Linear blocks (BN + Dropout).
# No TIMM dependency — suitable for quick experiments and small datasets.
# Pair with: configs/data/lejepa_multicrop.yaml
model:
  class_path: src.modules.LeJEPACNNModule
  init_args:
    in_channels: 3
    conv_channels:        # output channels per Conv2d block
      - 32
      - 64
      - 128
    linear_dims:          # neuron count per Linear block
      - 1024
      - 512
      - 256
    dropout: 0.2
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05             # weight on SIGReg; (1 - lam) on invariance loss
    sigreg_type: simple   # "simple" (faster) or "real" (Epps-Pulley)
    lr: 5.0e-4
    weight_decay: 5.0e-2
    warmup_epochs: 10
