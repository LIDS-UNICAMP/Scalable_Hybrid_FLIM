# LeJEPA config — RealSIGReg (Epps-Pulley characteristic-function test).
# Follows the exact paper definition (LeJEPA, Def. 2 + Sec. 4.2.3).
# T(x) = N * integral |ECF(x,t) - exp(-t^2/2)|^2 * exp(-t^2/2) dt
# Pair with: configs/data/lejepa_multicrop.yaml
model:
  class_path: src.modules.LeJEPAModule
  init_args:
    arch: vit_small_patch16_224
    pretrained: false
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05           # paper recommends lam in [1e-3, 1e-1]
    sigreg_type: real
    lr: 5.0e-4
    weight_decay: 5.0e-2
    warmup_epochs: 10
