# LeJEPA self-supervised pretraining config (SIGReg + invariance loss).
# Pair with: configs/data/flim_multicrop.yaml (ssl_mode: true, n_global: 2, n_local: 6)
model:
  class_path: methods.lejepa.LeJEPAModule
  init_args:
    arch: vit_small_patch16_224
    pretrained: false
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.5          # weight on SIGReg; (1 - lam) on invariance loss
    lr: 5.0e-4
    weight_decay: 5.0e-2
    warmup_epochs: 10
