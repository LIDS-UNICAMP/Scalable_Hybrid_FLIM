# LeJEPA config — SimpleSIGReg (moment-matching test statistic).
# T(x) = mean(x)^2 + (std(x) - 1)^2  applied per random projection.
# Cheaper than Epps-Pulley; good for fast iteration.
# Pair with: configs/data/lejepa_multicrop.yaml
model:
  class_path: src.modules.LeJEPAModule
  init_args:
    arch: vit_small_patch16_224
    pretrained: false
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05           # paper recommends lam in [1e-3, 1e-1]
    sigreg_type: simple
    lr: 5.0e-4
    weight_decay: 5.0e-2
    warmup_epochs: 10
