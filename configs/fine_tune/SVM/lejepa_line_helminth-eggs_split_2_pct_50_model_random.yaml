# SVM evaluation config for lejepa_line_helminth-eggs_split_2_pct_50_model_random
# wandb_run_id: 36bkhn4o
experiment:
  wandb_run_id: 36bkhn4o
  name: lejepa_line_helminth-eggs_split_2_pct_50_model_random
  dataset_name: helminth-eggs
  split_id: 2
  percentage: 50
  initialization_type: random
  num_classes: 9

svm:
  kernel: linear
  C: 100.0
  gamma: auto
  degree: 3
  max_iter: 10000
  coef0: 0
  decision_function_shape: ovo

evaluation:
  image_size: 200
  batch_size: 32
  num_workers: 4
  loader: ift_lab
