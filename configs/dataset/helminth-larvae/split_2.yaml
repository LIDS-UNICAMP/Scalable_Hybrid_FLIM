# Data config for the LeJEPA Line pipeline — single parasite, single split.
# Parasite : helminth-larvae_split_2
# Split    : 2
data:
  class_path: core.data.ParasiteDataModule
  init_args:
    parasite_name: helminth-larvae_split_2
    split: 2
    batch_size: 32
    num_workers: 8
    loader: ift_lab
    image_size: 200
    V_train: 12
    V_eval: 1
    pin_memory: true
    persistent_workers: true
    use_mask: false
