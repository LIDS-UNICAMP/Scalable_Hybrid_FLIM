# Data config for the LeJEPA Line pipeline — single parasite, single split.
# Parasite : helminth-larvae_split_1
# Split    : 1
# Percentage: 50
#
# YAML base directory:
#   configs/data/percentage/helminth-larvae_split_1/50/
data:
  class_path: core.data.ParasiteDataModule
  init_args:
    parasite_name: helminth-larvae_split_1
    split: 1
    percentage: 50
    batch_size: 32
    num_workers: 8
    loader: ift_lab
    image_size: 200
    V_train: 12
    V_eval: 1
    pin_memory: true
    persistent_workers: true
    use_mask: false
