# Data config for the LeJEPA Line pipeline — single parasite, single split.
# Parasite : helminth-larvae_split_3
# Split    : 3
# Percentage: 5
#
# YAML base directory:
#   configs/data/percentage/helminth-larvae_split_3/5/
data:
  class_path: core.data.ParasiteDataModule
  init_args:
    parasite_name: helminth-larvae_split_3
    split: 3
    percentage: 5
    batch_size: 32
    num_workers: 8
    loader: ift_lab
    image_size: 200
    V_train: 12
    V_eval: 1
    pin_memory: true
    persistent_workers: true
    use_mask: false
