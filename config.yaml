# lightning.pytorch==2.6.1
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: null
  logger: false
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: best-epoch={epoch:03d}-val_loss={val/loss:.4f}
      monitor: val/loss
      verbose: false
      save_last: true
      save_top_k: 1
      save_on_exception: false
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      min_delta: 0.0
      patience: 2
      verbose: true
      mode: min
      strict: true
      check_finite: true
      stopping_threshold: null
      divergence_threshold: null
      check_on_train_epoch_end: null
      log_rank_zero_only: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
      log_momentum: false
      log_weight_decay: false
  - class_path: lightning.pytorch.callbacks.RichProgressBar
    init_args:
      refresh_rate: 100
      leave: false
      theme:
        description: ''
        progress_bar: '#6206E0'
        progress_bar_finished: '#6206E0'
        progress_bar_pulse: '#6206E0'
        batch_progress: ''
        time: dim
        processing_speed: dim underline
        metrics: italic
        metrics_text_delimiter: ' '
        metrics_format: .3f
      console_kwargs: null
  fast_dev_run: false
  max_epochs: 1
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: 2
  limit_val_batches: 1
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: 1
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
  enable_autolog_hparams: true
  model_registry: null
model:
  class_path: src.modules.lejepa_line_module.LejepaLineModule
  init_args:
    arch_json: data/to_mateus/model/ch24_32_48_a0.5_f5/eggs/train1/architecture.json
    encoder_init: flim
    flim_weights_path: data/to_mateus/model/ch24_32_48_a0.5_f5/eggs/train1/models
    in_channels: 3
    proj_dim: 256
    proj_hidden: 2048
    lam: 0.05
    sigreg_type: real
    lr: 0.0005
    weight_decay: 0.05
    warmup_epochs: 10
    num_log_images: 8
    log_img_every_n_epochs: 5
data:
  class_path: src.data_modules.parasite_data_module_lejepa_splited.ParasiteLejepaDataModuleSplited
  init_args:
    parasite_name: helminth-eggs_split_2
    split: 1
    percentage: 1.0
    image_size: 200
    V_train: 12
    V_eval: 1
    batch_size: 15
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    loader: ift_lab
    use_mask: false
use_wandb: true
optimizer: null
lr_scheduler: null
ckpt_path: null
weights_only: null
