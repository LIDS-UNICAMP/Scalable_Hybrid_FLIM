# Crescimento SPiFiL com alvo I-JEPA congelado (ViT-H/14), Exp2.
# Camada por camada do zero, como growth_layerwise5_flim.yaml: o SPiFiL gera L1 -> estagio L1;
# gera L2 sobre L1 treinada -> estagio L2; ... ate L5 (24/32/48/60/120, kernels 5/5/5/1/1).
# Em cada estagio a camada nova treina a lr cheio e as antigas a lr * old_layer_lr_scale (0.1).
# Aluno: crop do bbox em LAB so com as celulas de contexto; prediz os tokens do I-JEPA nas
# celulas-alvo (methods/ijepa_grow/). Sem sonda SVM no treino: o SVM roda so no eval.
name:   spifil_growth_ijepa_exp2
method: ijepa_grow
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [1]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  5
  paper_classes: true
  layer_channels: [24, 32, 48, 60, 120]
  layer_kernels: [5, 5, 5, 1, 1]
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/ijepa_grow_exp2

wandb:
  enabled: true
  project: phd_thesis_ijepa_grow

skip: state

evaluate:
  SVM: false
