# SVM oficial sobre o encoder congelado de cada estagio da growth_ijepa_exp1 (alvo I-JEPA congelado).
name:   svm_layerwise_ijepa_grow_exp1
method: ijepa_grow
runner: eval

grid:
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         ijepa_grow_exp1
  ckpt_selection: best
  results_csv:    results/svm_layerwise_ijepa_grow_exp1.csv

resources:
  gpu_ids:             [0]
  max_per_gpu:         1
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_layerwise_ijepa_grow_exp1

skip: state
