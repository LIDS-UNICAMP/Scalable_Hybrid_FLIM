# Destilacao: distill_direct_trunc_normal
# Baseline direto com init trunc_normal. A MAIOR familia: 619 runs, rodada nos QUATRO
#  modules (conv, base, one_layer, two_layer) - troque o class_path para reproduzir cada um.
#
# RECONSTRUIDO do argv real gravado em wandb-metadata.json (619 runs em artifacts/).
# Comando antigo equivalente:
#   python -m src.modules.distillation_onelayer_module \
#     --distillation-type direct --encoder-init trunc_normal --alpha 0.5 --temperature 4.0 --dataset <ds> --split <N> --percentage <P>
#
# O class_path e a escolha do student; as flags --distill_1..4 nao existem mais.

name:   distill_direct_trunc_normal
method: distillation
runner: train

grid:
  init:        [trunc_normal]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]

runner_args: {}

overrides:
  model.class_path: methods.distillation.DistillationOneLayerModule
  model.init_args.distillation_type: direct
  model.init_args.alpha: 0.5
  model.init_args.temperature: 4.0

resources: {gpu_ids: [0, 1, 2, 3], max_per_gpu: 2, cpus_per_experiment: 8}
output:    {work_dir: /dados/home/moliveira/artifacts/distillation/distill_direct_trunc_normal}
wandb:     {enabled: true, project: phd_thesis_distill}
skip: state
