# Destilacao: distill4_all_kd_frozen
# KD hibrido (fine_tune=True), professor CONGELADO.
#
# RECONSTRUIDO do argv real gravado em wandb-metadata.json (22 runs em artifacts/).
# Comando antigo equivalente:
#   python -m src.modules.distillation_conv_module \
#     --distill_4 --init_flim --teacher_frozen --fine_tune True --dataset <ds> --split <N> --percentage <P>
#
# O class_path e a escolha do student; as flags --distill_1..4 nao existem mais.

name:   distill4_all_kd_frozen
method: distillation
runner: train

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [5, 50]

runner_args: {}

overrides:
  model.class_path: methods.distillation.DistillationConvModule
  model.init_args.distillation_type: kd_hybrid
  model.init_args.teacher_frozen: true
  # DistillationConvModule NAO tem a KnnKappaProbeMixin e nunca loga
  # `val/knn_kappa`; o ModelCheckpoint do config de celula monitora essa chave
  # e o fit morre no fim da primeira validacao. Substituimos a lista inteira
  # pelo checkpoint do modulo original (src/modules/distillation_conv_module.py:555-562),
  # parametro a parametro.
  trainer.callbacks: '[{"class_path":"lightning.pytorch.callbacks.ModelCheckpoint","init_args":{"filename":"best_knn_kappa","monitor":"val/knn_kappa","mode":"max","save_last":false,"save_top_k":1,"save_weights_only":true}},{"class_path":"lightning.pytorch.callbacks.ModelCheckpoint","init_args":{"filename":"best_loss","monitor":"val/loss","mode":"min","save_last":false,"save_top_k":1,"save_weights_only":true}},{"class_path":"lightning.pytorch.callbacks.EarlyStopping","init_args":{"monitor":"val/loss","mode":"min","patience":30,"verbose":true}}]'

resources: {gpu_ids: [1, 2, 3], max_per_gpu: 4, cpus_per_experiment: 8}
output:    {work_dir: /dados/home/moliveira/artifacts/distillation/distill4_all_kd_frozen}
wandb:     {enabled: true, project: phd_thesis_distill}
skip: state
