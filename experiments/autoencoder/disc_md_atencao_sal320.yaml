# Pedido do usuario (11/11): levar "320 px + atencao" e "saliencia" para as bases ruins (flowers, ham10000, remote_sensing).
# Os dois juntos: 320 px + atencao (espacial, simam; L5/final) + TTA, com e sem saliencia (fpsw x fps). 3 splits, 50%, so validacao.
name: svm_disc_md_atencao_sal320
method: autoencoder
runner: eval
grid:
  datasets: [flowers, ham10000, remote_sensing]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_atencao_sal320
  results_csv: results/svm_disc_md_atencao_sal320
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [320]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/atencao_sal320
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: [random_z]
    tta: true
    atencao: {mecanismos: [espacial, simam], camadas: [5, final], modo: a, alpha: 0.5}
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 2
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_atencao_sal320
skip: state
