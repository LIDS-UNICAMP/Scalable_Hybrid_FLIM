# Receita SPiFiL INTEIRA (spf_grade: 6x256, k5, pools 2-2-2-2-1-1, whitening dobrado nas convs, 200 px) como partida,
# depois LeJEPA do artigo (Balestriero & LeCun, arXiv 2511.08544; rbalestr-lab/lejepa) no lugar da reconstrucao:
# 0.05*SIGReg (Epps-Pulley, 1024 fatias) + 0.95*invariancia (cada vista puxada para a media das 2 globais),
# projetor torchvision MLP 256->2048->2048->64 (BN so nas ocultas) sobre o GeM da L6, descartado na avaliacao.
# Vistas: 2 globais 200 px (crop 0,3-1,0) + 6 locais 96 px (0,05-0,3), flip, jitter LAB p 0,8, cinza 0,2, blur 0,5, solarize L 0,2.
# AdamW lr 5e-4, wd 5e-4, warmup 3 + cosseno, lote 64; epocas por orcamento de passos (epochs_by_dataset).
# Zero rotulo no treino e na escolha: checkpoint = ultima epoca (ckpt_last), parada so pela val_ssl_loss; kappa da sonda por epoca so gravado; L0 = a receita intacta.
# SMOKE athena: Larvae s1 p50, 2 epocas, lote 48. 11/11.
name:   spifil_growth_hyb_receita_inteira_lejepa_smoke
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [Larvae]
  splits:      [1]
  percentages: [50]

resources:
  gpu_ids:             [0]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  init_flim_dir: /exps/moliveira/encoders/hyb_receita_inteira/fpsw@mapa_w0.5_1
  layerwise:  6
  layerwise_from_flim: 6          # as 6 camadas vem do init_flim_dir; nenhum grow, um estagio L6 com tudo solto
  layer_channels: [256, 256, 256, 256, 256, 256]
  layer_kernels:  [5, 5, 5, 5, 5, 5]
  layer_pools:    [2, 2, 2, 2, 1, 1]
  image_size: 200
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  embed_mode: avgpool2d
  seed: 42
  train_aug: {p: 0.8, l_jitter: 0.2, ab_jitter: 0.02, stain: 0.2}   # so o jitter de cor; crop, flip, cinza, blur e solarize vem do lejepa
  lejepa: {lam: 0.05, sigreg_type: real, num_slices: 1024, head: mlp, proj_hidden: 2048, proj_dim: 64, global_views: 2, global_size: 200, global_scale: [0.3, 1.0], local_views: 6, local_size: 96, local_scale: [0.05, 0.3], gray: 0.2, blur: 0.5, solarize: 0.2}
  epochs_by_dataset: {Larvae: 2}   # smoke

output:
  work_dir: /exps/moliveira/spifil_growth/hyb_receita_inteira_lejepa_smoke

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 50          # so o fallback: cada base vem de epochs_by_dataset
  trainer.max_epochs: 50
  model.init_args.lr: 5.0e-4
  model.init_args.weight_decay: 5.0e-4
  model.init_args.warmup_epochs: 3
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 2
  data.init_args.batch_size: 48            # smoke: cabe no teto de 25 GB do athena; o oficial usa 64
  model.init_args.epoch_probe: gem
  model.init_args.best_by_probe: false
  model.init_args.ckpt_last: true          # sem rotulo: ultima epoca; EarlyStopping so na val_ssl_loss; a sonda por epoca so e gravada
