# SVM de validacao so do protozoan da growth_disc_r1 (1 por vez, CPU cheia).
name:   svm_disc_r1_val_proto
method: autoencoder
runner: eval

grid:
  datasets:    [protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         disc_r1
  ckpt_selection: best
  results_csv:    results/svm_disc_r1_val.csv
  embed_mode:     flatten
  eval_set:       val

resources:
  gpu_ids:             [3]
  max_per_gpu:         1
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_disc_r1_val_proto

skip: state
