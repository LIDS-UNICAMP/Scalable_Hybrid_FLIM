# Crescimento camada por camada, do zero, ate L3.
# Cada Lk e cortada pelo SPiFiL (config do paper, runners/growth.py:LAYERWISE_SPECS)
# sobre L1..L(k-1) ja treinadas; so Lk aprende, com um decoder novo por camada.
name:   spifil_growth_layerwise3
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]

resources:
  gpu_ids:             [0, 1]
  max_per_gpu:         4
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  3
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/layerwise3

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state
