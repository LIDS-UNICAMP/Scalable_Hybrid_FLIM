# Protozoan a parte: SVM de 150 s por ajuste, entao so a leitura oficial; o resto como disc_md_l1fast.yaml.
name: svm_disc_md_l1fast_protozoan
method: autoencoder
runner: eval
grid:
  datasets: [Protozoan]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: l1_fast
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_l1fast
  results_csv: results/svm_disc_md_l1fast
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [64, 96, 128, 200, 256, 320, 448, 640]
  l1_superpixels: [12, 25, 50, 100, 200, 400, 800, 1600]
  l1_random: [100]
  l1_readouts: [gem_tta_pw]
  l1_grow:
    out_channels: 64
    kernel_size: 5
    pool_stride: 2
    impurities: true
    superpixels: disf
    budget_check: false
resources:
  gpu_ids: [3]
  max_per_gpu: 2
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/eval/disc_md_l1fast_protozoan
skip: state
