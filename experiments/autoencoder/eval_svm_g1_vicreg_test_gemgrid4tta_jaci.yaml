# SVM final por camada da Rede 1 (g1q_vicreg_jaci.yaml): GeM por regiao 4x4 (128x16 = 2048) + TTA desfazendo a grade sem whitening (largura cheia), conjunto de test, depois do treino.
# Estagios = pastas que o growth grava (<work_dir>/<braco>/L{k} e L{k}_ft, runners/growth.py _stage_dir).
# 100% e 75%: o mesmo YAML com --set grid.percentages=[100] (ou [75]).
name: svm_g1_vicreg_test_gemgrid4tta_jaci
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing, flowers, coconut_trees, ham10000, food101, Eggs, Larvae, Protozoan]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  artifacts_dir: /dados/home/moliveira/exps/artifacts
  family: g1_vicreg
  ckpt_selection: best
  results_csv: results/svm_g1_vicreg_test_gemgrid4tta_jaci.csv
  embed_mode: gemgrid4_tta
  eval_set: test
  # a mesma geometria do treino (g1q_vicreg_jaci.yaml)
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  stages: [L1, L1_ft, L2, L2_ft, L3, L3_ft, L4, L4_ft]
resources:
  gpu_ids: [0]
  max_per_gpu: 1
  cpus_per_experiment: 8
output:
  work_dir: /dados/home/moliveira/exps/artifacts/eval/svm_g1_vicreg_test_gemgrid4tta_jaci
skip: state
