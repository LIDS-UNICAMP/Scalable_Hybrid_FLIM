# Filtro de janela chapada (plano_tol): o mesmo braco com e sem `~pl0.004`, mesmas sementes e mesma largura; helminth_eggs + Eggs_subgroup (fundo preto).
name: svm_disc_md_plano_helminth
method: autoencoder
runner: eval
grid:
  datasets: [helminth_eggs, Eggs_subgroup]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_plano_helminth
  results_csv: results/svm_disc_md_plano_helminth
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/plano_helminth
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    plano_tol: [0, 0.004]
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z, orth]
    twin_controls: [orth, random_z]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_plano_helminth
skip: state
