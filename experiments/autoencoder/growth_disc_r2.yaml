# Descoberta R2: crescimento profundo, 8 camadas (antes 3). L4 ainda com pool; de L5 a L8 sem pool,
# com dilatacao 2,2,4,4 para o campo receptivo crescer sem encolher o mapa. Re-treina L1..L3.
name:   spifil_growth_disc_r2
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [0, 1, 2]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  8
  paper_classes: true
  layer_channels: [24, 32, 48, 48, 64, 64, 64, 64]
  layer_kernels:  [5, 5, 5, 5, 3, 3, 3, 3]
  layer_dilations: [1, 1, 1, 1, 2, 2, 4, 4]
  layer_pools:    [2, 2, 2, 2, 1, 1, 1, 1]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_r2

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1   # base nova: fundo pesa 0.1 (achado L2 fundo)
