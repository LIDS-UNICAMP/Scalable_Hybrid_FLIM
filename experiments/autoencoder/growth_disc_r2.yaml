# Descoberta R2: R1 + L4 (48 filtros, dilatacao 2, sem pool). Re-treina L1..L3:
# layerwise_from_flim parte do FLIM de data/, nao do checkpoint do R1.
name:   spifil_growth_disc_r2
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [3]
  max_per_gpu:         2
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  4
  paper_classes: true
  layer_channels: [24, 32, 48, 48]
  layer_kernels:  [5, 5, 5, 5]
  layer_dilations: [1, 1, 1, 2]
  layer_pools:    [2, 2, 2, 1]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_r2

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
