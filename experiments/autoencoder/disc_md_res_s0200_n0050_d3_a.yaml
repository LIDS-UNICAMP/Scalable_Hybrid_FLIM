# Ablacao de tamanho: 200 px, n = 50, L3, braco P, lote 32x1
name:   spifil_growth_disc_md_res_s0200_n0050_d3_a
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth_eggs, flowers, Larvae, Protozoan]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [0]
  max_per_gpu:         1
  cpus_per_experiment: 10

runner_args:
  layerwise:  3
  impurities: true
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  image_size: 200
  layer_channels: [32, 48, 64]
  layer_kernels:  [5, 5, 5]
  layer_pools:    [2, 2, 2]
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d

output:
  work_dir: /exps/moliveira/spifil_growth/disc_md_res_s0200_n0050_d3_a

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 20
  trainer.max_epochs: 20
  model.init_args.warmup_epochs: 2
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 8
  model.init_args.epoch_probe: gem
  model.init_args.best_by_probe: true
  data.init_args.batch_size: 32
