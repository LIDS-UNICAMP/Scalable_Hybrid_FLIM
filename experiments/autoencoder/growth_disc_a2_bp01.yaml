# A2 eixo SPiFiL+backprop: R1 com as camadas antigas treinando junto (lr * 0.1) em vez de congeladas.
name:   spifil_growth_disc_a2_bp01
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [3]
  max_per_gpu:         2
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  3
  paper_classes: true
  layer_channels: [24, 32, 48]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten
  layerwise_backprop: 0.1

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_a2_bp01

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1   # base nova: fundo pesa 0.1 (achado L2 fundo)
