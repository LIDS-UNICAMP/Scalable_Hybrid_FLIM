# Piloto das bases novas: 1 job de spf_grade por base, split 1, sorteio 42, 64 filtros, fps e random_z.
name: svm_disc_md_ext_piloto
method: autoencoder
runner: eval
grid:
  datasets: [coconut_trees, food101]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_ext_piloto
  results_csv: /exps/moliveira/results_sol/ext/svm_disc_md_ext_piloto
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    fontes: /exps/moliveira/fontes_filtros/sol
    shards: 1
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [64]
    kernels: [5]
    depth: 3
    pool: 2
    saliency: {map: gmr, cuts: []}
    leituras: [gem]
    methods: [fps]
    controls: [random_z]
    twin_controls: [random_z]
resources:
  gpu_ids: [3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_ext_piloto
skip: state
