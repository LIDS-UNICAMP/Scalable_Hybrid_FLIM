# SVM de checagem sobre cada camada da growth_disc_bp01w64.
name:   svm_disc_bp01w64_test_spp
method: autoencoder
runner: eval

grid:
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         disc_bp01w64
  ckpt_selection: best
  results_csv:    results/svm_disc_bp01w64_test_spp.csv
  embed_mode:     spp   # leitura so de eval (A5)
  eval_set:       test   # twin de teste: so relatorio; selecao fica na val
  stages:         [L3]   # so a camada de decisao: 9 jobs em vez de 27 (CPU)

resources:
  gpu_ids:             [1]   # SVM: 1 por vez na maquina
  max_per_gpu:         1
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_disc_bp01w64_test_spp

skip: state
