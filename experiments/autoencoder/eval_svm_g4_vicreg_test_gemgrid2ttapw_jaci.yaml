# SVM final por camada da Rede 4 (g4q_vicreg_jaci.yaml): GeM por regiao 2x2 (512x4 = 2048) + TTA desfazendo a grade + whitening, conjunto de test, depois do treino.
# Estagios = pastas que o growth grava (<work_dir>/<braco>/L{k} e L{k}_ft, runners/growth.py _stage_dir).
# 100% e 75%: o mesmo YAML com --set grid.percentages=[100] (ou [75]).
name: svm_g4_vicreg_test_gemgrid2ttapw_jaci
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing, flowers, coconut_trees, ham10000, food101, Eggs, Larvae, Protozoan]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  artifacts_dir: /dados/home/moliveira/exps/artifacts
  family: g4_vicreg
  ckpt_selection: best
  results_csv: results/svm_g4_vicreg_test_gemgrid2ttapw_jaci.csv
  embed_mode: gemgrid2_tta_pw
  eval_set: test
  # a mesma geometria do treino (g4q_vicreg_jaci.yaml)
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  stages: [L1, L1_ft, L2, L2_ft, L3, L3_ft, L4, L4_ft, L5, L5_ft, L6, L6_ft]
resources:
  gpu_ids: [0]
  max_per_gpu: 1
  cpus_per_experiment: 8
output:
  work_dir: /dados/home/moliveira/exps/artifacts/eval/svm_g4_vicreg_test_gemgrid2ttapw_jaci
skip: state
