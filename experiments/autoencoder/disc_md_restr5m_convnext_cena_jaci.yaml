# Restricao <= 5 M params (11/11), leis da literatura traduzidas para o SPiFiL: A_reports/november/multi_dataset/restricao_5M.md.
# Protocolo de disc_md_receita_tta (TTA, entre_camadas, 50%, 3 splits, sorteio 42); controle puro random_z da MESMA arquitetura.
# ConvNeXt 1:1:3:1: tres camadas no 3o estagio (pools 2-2-1-1-2-1), larguras C-2C-4C-4C-4C-8C, k3, 200 px.
name: svm_disc_md_restr5m_convnext_cena
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing, coconut_trees]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_restr5m_convnext_cena
  results_csv: results/svm_disc_md_restr5m_convnext_cena
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/restr5m_convnext_cena
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [0]
    kernels: [3]
    depth: 6
    pool: [2, 2, 1, 1, 2, 1]
    combo: {words: 512}
    entre_camadas: true
    tta: true
    methods: [fps]
    controls: [random_z]
    twin_controls: [random_z]
    leis:  # ordem de lancamento: 1 M, depois 4,5 M, depois 2 M
      - {lei: W, w: "40-80-152-152-152-312", depth: 6}
      - {lei: W, w: "80-168-328-328-328-656", depth: 6}
      - {lei: W, w: "56-112-216-216-216-440", depth: 6}
resources:
  gpu_ids: [0]
  max_per_gpu: 8   # GPU_CAP_MIB=4200 por processo
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_restr5m_convnext_cena
skip: state
