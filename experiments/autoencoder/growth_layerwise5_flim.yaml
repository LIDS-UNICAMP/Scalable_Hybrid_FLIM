# Crescimento camada por camada ate L5, gerado como o FLIM de data/: classes do artigo,
# 24/32/48/48/48 filtros, kernel 5x5, DISF com 50 superpixels, sem a trava N <= D
# (o SPiFiL original nao tem essa trava). Sementes SO das classes do artigo:
# sem a impureza no eggs (classe 9) e no protozoan (classe 7); o larvae mantem as 2.
# Igual ao growth_layerwise5.yaml em todo o resto.
# Cada Lk e cortada pelo SPiFiL (config do paper, runners/growth.py:LAYERWISE_SPECS)
# sobre L1..L(k-1) ja treinadas; so Lk aprende, com um decoder novo por camada.
name:   spifil_growth_layerwise5_flim
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]

resources:
  gpu_ids:             [0, 1, 2, 3]
  max_per_gpu:         5
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  5
  paper_classes: true
  layer_channels: [24, 32, 48, 64, 96]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/layerwise5_flim

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  # Sem sonda SVM no treino: era ela que afogava a grade. O SVM roda so no eval_svm_layerwise5_flim.
  SVM: false
