# Soma, nao troca (pedido 11/11): cat (GeM L1-L6) concatenado com mscp / cov60 da L6 (`amostra.somar`): cada bloco com o pw_whiten do SVM (shrinkage + L2) depois da PCA
# fitados no treino, metade da dimensao (768 + 915 = 1683-d < 2000). Mesmos bracos e bases de disc_md_relglob.yaml, 3 splits, 50%, so validacao.
# random_z fica sem mecanismo (regua pura).
name: svm_disc_md_relglob_somar
method: autoencoder
runner: eval
grid:
  datasets: [remote_sensing, flowers]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_relglob_somar
  results_csv: results/svm_disc_md_relglob_somar
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/receita_tta
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: [random_z]
    leituras: [gem, cov60, mscp]
    somar: true
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_relglob_somar
skip: state
