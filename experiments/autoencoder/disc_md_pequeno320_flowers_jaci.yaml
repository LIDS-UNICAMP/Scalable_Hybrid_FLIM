# Pequenos (<=5 M) a 320 px em vez de 200 (copia de disc_md_restr5m_k3_obj_jaci); 320 ajudou a receita de 8,2 M.
# Uma lei (a melhor pequena da base), TTA, 50%, splits 1-3, random_z puro. Pico ~6 GB/job estimado (320/200)^2 x ~2,3 GB.
name: svm_disc_md_pequeno320_flowers
method: autoencoder
runner: eval
grid:
  datasets: [flowers]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_pequeno320_flowers
  results_csv: results/svm_disc_md_pequeno320_flowers
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [320]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/pequeno320_flowers
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [0]
    kernels: [3]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    tta: true
    methods: [fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: [random_z]
    leis:
      - {lei: W, w: "104-104-104-104-104-104", depth: 6, k: "3-3-3-5-5-5"}
resources:
  gpu_ids: [0]
  max_per_gpu: 6   # GPU_CAP_MIB=6000 por processo
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_pequeno320_flowers
skip: state
