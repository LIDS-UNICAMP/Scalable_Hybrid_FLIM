# Combo com whitening entre camadas nas 6 bases que faltavam; mesmo protocolo de disc_md_spfcombo_w (3 splits).
name: svm_disc_md_spfcombo_w2
method: autoencoder
runner: eval
grid:
  datasets: [Protozoan, Eggs, Larvae, protozoan_cysts, helminth_larvae, remote_sensing]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_spfcombo_w2
  results_csv: results/svm_disc_md_spfcombo_w2
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [64, 256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    soma: true
    entre_camadas: true
    methods: [fps@combo, cos@combo]
    controls: [orth, xavier, tnorm, random_z]
    twin_controls: [orth, xavier, random_z]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_spfcombo_w2
skip: state
