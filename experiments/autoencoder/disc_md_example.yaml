# Exemplo disc_md: os 12 datasets de organized/, receita oficial _bg1 (bp01w64c1280), sem mascara e sem corte.
name:   spifil_growth_disc_md_example
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [Eggs, Protozoan, Larvae, Eggs_subgroup, Protozoan_subgroup, Larvae_subgroup,
                aid, flowers, remote_sensing, helminth_eggs, helminth_larvae, protozoan_cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [0, 1, 2]
  max_per_gpu:         1
  cpus_per_experiment: 10

runner_args:
  layerwise:  4
  impurities: true                # mascara desligada no grow (nos 12 ela ja nem e lida)
  no_crop: true                   # letterbox: a imagem inteira entra; image_size: N muda grow, dados e decoder juntos
  layer_channels: [32, 48, 64, 1280]
  layer_kernels:  [5, 5, 5, 1]
  layer_pools:    [2, 2, 2, 1]    # L4 sem pooling
  fill_random_last: true          # 50 sp por imagem nao enchem a L4; resto aleatorio
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d           # 1280x24x24 achatado = 737k-d, inviavel no kappa de treino
  layerwise_backprop: 0.1

output:
  work_dir: /exps/moliveira/spifil_growth/disc_md_example

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 1.0   # oficial _bg1: fundo pesa igual, sem pseudo-mascara na loss
  data.init_args.num_workers: 2          # resources.num_workers nao chega ao filho
