# SVM da Rede 1 fechando em 1024 (g1x1024_ae.yaml): gem + TTA, 1024-d, sem whitening, depois do treino.
# Estagios = pastas que o growth grava (<work_dir>/<braco>/L{k} e L{k}_ft, runners/growth.py _stage_dir).
# 100% e 75%: o mesmo YAML com --set grid.percentages=[100] (ou [75]).
name: svm_g1x1024_ae_test_gemtta
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing, flowers, coconut_trees, ham10000, food101, Eggs, Larvae, Protozoan]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  artifacts_dir: /exps/moliveira/artifacts
  family: g1x1024_ae
  ckpt_selection: best
  results_csv: results/svm_g1x1024_ae_test_gemtta.csv
  embed_mode: gem_tta
  eval_set: test
  # a mesma geometria do treino (g1x1024_ae.yaml)
  image_size: 200
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  stages: [L3, L4, L4_ft]
resources:
  gpu_ids: [2]
  max_per_gpu: 1
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/artifacts/eval/svm_g1x1024_ae_test_gemtta
skip: state
