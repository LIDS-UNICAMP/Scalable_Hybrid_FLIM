# SOL Rodada 1, P1: N6 = z-score por patch (N1) + whitening entre camadas, lambda em 3 pontos, escolhido so pela validacao.
name: svm_disc_md_sol_p1_n6
method: autoencoder
runner: eval
grid:
  datasets: [Eggs_subgroup, Protozoan_subgroup, Larvae_subgroup, aid, flowers, helminth_eggs]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_sol_p1_n6
  results_csv: /dados/home/moliveira/exps/results_sol/normalization/svm_disc_md_sol_p1_n6
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    fontes: /dados/home/moliveira/exps/tmp/sol_fontes
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [64, 256]
    kernels: [5]
    depth: 3
    pool: 2
    saliency: {map: gmr, cuts: []}
    agrupamento: {eps: 0.01, rows: 5000}
    entre_camadas: [0.001, 0.01, 0.1]
    leituras: [gem]
    methods: [crus@geodesic, fps, fpsw@mapa_peso]
    controls: [random_z, xavier, orth]
    twin_controls: [random_z, xavier, orth]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_sol_p1_n6
skip: state
