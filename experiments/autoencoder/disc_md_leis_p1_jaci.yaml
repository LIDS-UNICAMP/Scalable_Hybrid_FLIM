# Divisao (08/11): athena roda aid, flowers e remote_sensing; o gemeo _jaci roda Larvae e Eggs. Sem sobreposicao.
# Leis de construcao, piloto P1: 17 arquiteturas nao uniformes (A geometrica, B posicao relativa, C orcamento) sobre a receita sol_wsal.
# Controles puros (random_z, orth): mesma arquitetura, kernel, pool, leitura e protocolo. Ancora uniforme 256 d6 ja existe em disc_md_sol_wsal.
# C: P = 8211200 = params de conv da receita 256x6, k5. Pool da receita cortado na profundidade: d4 -> 2-2-2-2 (mapa final 11 px a 200).
name: svm_disc_md_leis_p1
method: autoencoder
runner: eval
grid:
  datasets: [Larvae, Eggs]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_leis_p1
  results_csv: results/svm_disc_md_leis_p1
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/leis_p1
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [0]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z, orth]
    twin_controls: [orth, random_z]
    leis:
      - {lei: A, w0: 256, r: 0.5, depth: 4}
      - {lei: A, w0: 256, r: 0.5, depth: 6}
      - {lei: A, w0: 256, r: 0.71, depth: 4}
      - {lei: A, w0: 256, r: 0.71, depth: 6}
      - {lei: A, w0: 512, r: 0.5, depth: 4}
      - {lei: A, w0: 512, r: 0.5, depth: 6}
      - {lei: A, w0: 512, r: 0.71, depth: 4}
      - {lei: A, w0: 512, r: 0.71, depth: 6}
      - {lei: B, w0: 512, wL: 32, f: lin, depth: 4}
      - {lei: B, w0: 512, wL: 32, f: lin, depth: 6}
      - {lei: B, w0: 512, wL: 32, f: fast, depth: 4}
      - {lei: B, w0: 512, wL: 32, f: fast, depth: 6}
      - {lei: B, w0: 512, wL: 32, f: late, depth: 4}
      - {lei: B, w0: 512, wL: 32, f: late, depth: 6}
      - {lei: C, P: 8211200, depth: 6, forma: {lei: A, w0: 512, r: 0.5}}
      - {lei: C, P: 8211200, depth: 6, forma: {lei: B, w0: 512, wL: 32, f: lin}}
      - {lei: C, P: 8211200, depth: 6, forma: {lei: B, w0: 512, wL: 128, f: late}}
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_leis_p1
skip: state
