# Descoberta R1 (baseline): flim_L3 do growth_layerwise5_flim (24/32/48, k5, DISF/50),
# so 50%, 200 epocas, GPU 3. Decide pela val_recon_loss; o SVM e so checagem.
name:   spifil_growth_disc_r1
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [3]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  3
  paper_classes: true
  layer_channels: [24, 32, 48]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_r1

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
