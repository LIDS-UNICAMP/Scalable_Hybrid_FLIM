# growth_layerwise5 + data augmentation (flip H/V + rotacao 90) so no backprop; o resto e identico.
# Cada Lk e cortada pelo SPiFiL (config do paper, runners/growth.py:LAYERWISE_SPECS)
# sobre L1..L(k-1) ja treinadas; so Lk aprende, com um decoder novo por camada.
name:   spifil_growth_layerwise5_aug
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]

resources:
  gpu_ids:             [2, 3]
  max_per_gpu:         2
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  5
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/layerwise5_aug

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  # Sem sonda SVM no treino: era ela que afogava a grade. O SVM roda so no eval_svm_layerwise5_aug.
  SVM: false

# SPiFiL (grow) e SVM leem imagem crua; so o DataLoader de treino recebe a augmentation.
overrides:
  data.init_args.geo_aug: true
  # medido (larvae 100%, 1 epoca de DataLoader): 2 workers 5.8s, 4 workers 3.3s, 8 workers 1.8s;
  # 4 porque a maquina ja esta em load ~83/96. resources.num_workers nao chega no treino.
  data.init_args.num_workers: 4
