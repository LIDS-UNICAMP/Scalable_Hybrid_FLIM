# HAM10000 (ISIC 2018 Task 3, 7 classes) com a receita minimax do sol_wsal: fpsw@mapa_w0.5_1, whitening entre camadas, L6, 256 filtros.
# fps sem saliencia como referencia e os 4 controles aleatorios como regua. Sem mascara: o HAM10000 nao tem segmentacao destas imagens aqui.
name: svm_disc_md_ham
method: autoencoder
runner: eval
grid:
  datasets: [ham10000]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_ham
  results_csv: results/svm_disc_md_ham
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0.5], g: [1], foco: 400}
    fontes: /dados/home/moliveira/exps/tmp/ham_fontes
    shards: 3
    svm_workers: 1
    images: 500
    draws: [42, 43, 44]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [orth, xavier, tnorm, random_z]
    twin_controls: [orth, xavier, random_z]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_ham
skip: state
