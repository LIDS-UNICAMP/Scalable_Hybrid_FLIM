# Pool foco (rodada 2), F1 resolucao: receita sol_wsal (L6 256, entre_camadas, cat) com a entrada a 320 px. SAL-OFF (aid 600 px, remote_sensing 640 px nativos): so fps, sem saliencia.
# Superpixels fixos em 50 por imagem em toda resolucao (l1_superpixels; foco 400 so nos pontos de saliencia). Fontes por tamanho: o .pt de amostra.fontes nao leva o tamanho no nome.
# Ancora 200 px pareada (mesmos sorteios): celula lei A w0 256 r 1.0 (= 256x6) de disc_md_pf_leis_off. Controles aleatorios puros, sem tecnica. Piloto: split 1, sorteios 42 e 43.
name: svm_disc_md_pf_res320_off
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_pf_res320_off
  results_csv: /exps/moliveira/results_sol/pool_foco/svm_disc_md_pf_res320_off
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [320]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    fontes: /exps/moliveira/fontes_filtros/pf_res320_off
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    methods: [fps]
    controls: [random_z, orth]
    twin_controls: [random_z, orth]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_pf_res320_off
skip: state
