# Whitening entre camadas + saliencia gmr (peso na selecao e foco dos superpixels), juntos pela primeira vez; 12 bases, sem mascara real.
name: svm_disc_md_sol_wsal_piloto
method: autoencoder
runner: eval
grid:
  datasets: [Larvae_subgroup]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_sol_wsal_piloto
  results_csv: results/svm_disc_md_sol_wsal_piloto
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/wsal_piloto
    shards: 1
    svm_workers: 1
    images: 80
    draws: [42]
    widths: [64]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    methods: [fps, fps@combo, fps@mapa_otsu, fpsw@mapa_w0_1, fpsw@mapa_w0.5_1, fpsw@mapa_w0.75_2, fps@foco_w0_1, fps@foco_w0.5_1, fps@foco_w0.75_1]
    controls: [orth, xavier, tnorm, random_z]
    twin_controls: [orth, xavier, random_z]
resources:
  gpu_ids: [3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_sol_wsal_piloto
skip: state
