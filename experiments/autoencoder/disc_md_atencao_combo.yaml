# Combinacao (pedido do usuario): atencao (espacial, simam em L5 e final, modo a) + TTA (amostra.tta), 200 px, 3 splits, 50%, so validacao.
# Um job da cat, cat_att_*, cat_tta e cat_tta_att_* pareados no mesmo encoder. 320 px em disc_md_atencao_combo320.yaml; sem whitening em L4/L5 fica fora (encdeep: tronco 5 camadas, kernels 5-5-5-3-3, nao combina com a receita L6).
name: svm_disc_md_atencao_combo
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing, flowers]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_atencao_combo
  results_csv: results/svm_disc_md_atencao_combo
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/atencao_combo
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: [random_z]
    tta: true
    atencao: {mecanismos: [espacial, simam], camadas: [5, final], modo: a, alpha: 0.5}
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_atencao_combo
skip: state
