# F1 degrau 2: top 5 do degrau 1 + reconstrucao, B0, 60 epocas, semente 42.
name:   spifil_growth_disc_md_law_f1d2_recon_Eggs_sp2
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [Eggs]
  splits:      [2]
  percentages: [50]

resources:
  gpu_ids:             [1]
  max_per_gpu:         1
  cpus_per_experiment: 10

runner_args:
  layerwise:  4
  impurities: true                # mascara desligada no grow
  image_size: 200
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  layer_channels: [36, 45, 63, 1278]  # B0 de P4: multiplo de C
  layer_kernels:  [5, 5, 5, 1]
  layer_pools:    [2, 2, 2, 1]
  fill_random_last: true          # 50 sp por imagem nao enchem a L4; resto aleatorio
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d           # sem SVM no treino; so preenche o hparam
  layerwise_backprop: 0.1
  seed: 42

output:
  work_dir: /exps/moliveira/spifil_growth/disc_md_law_f1d2_recon_Eggs_sp2

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 60
  trainer.max_epochs: 60
  model.init_args.recon_bg_weight: 1.0   # oficial _bg1
  data.init_args.num_workers: 8
  model.init_args.best_by_probe: false   # checkpoint por val_recon_loss, sem rotulo
