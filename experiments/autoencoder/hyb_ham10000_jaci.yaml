# HAM10000 a 50%, jaci: a forma da receita SPiFiL (6 camadas x 256, k5, pools 2-2-2-2-1-1,
# 50 sp DISF, 200 px, whiten) crescida pelo grow do repo + o mesmo backprop do oficial _bg1.
# Lacuna: o grow do repo escolhe filtros com rotulo de imagem (1 por classe, Fisher), nao fps sem rotulo;
# o whiten e ZCA na escolha dos patches, nao o whitening entre_camadas no forward.
name:   spifil_growth_hyb_ham10000_jaci
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [ham10000]
  splits:      [1]
  percentages: [50]

resources:
  gpu_ids:             [0]
  max_per_gpu:         1             # GPU dividida: 1 braco por vez
  cpus_per_experiment: 8

runner_args:
  layerwise:  6
  paper_classes: true
  impurities: true
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  layer_channels: [256, 256, 256, 256, 256, 256]
  layer_kernels:  [5, 5, 5, 5, 5, 5]
  layer_pools:    [2, 2, 2, 2, 1, 1]
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  whiten: true
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
  seed: 42

output:
  work_dir: /dados/home/moliveira/exps/spifil_growth/hyb_ham10000_jaci

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 2
  model.init_args.best_by_probe: false
