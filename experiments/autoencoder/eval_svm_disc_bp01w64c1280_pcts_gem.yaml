# SVM de checagem sobre cada camada da growth_disc_bp01w64c1280.
name:   svm_disc_bp01w64c1280_pcts_gem
method: autoencoder
runner: eval

grid:
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         disc_bp01w64c1280
  ckpt_selection: best
  results_csv:    results/svm_disc_bp01w64c1280_pcts_gem.csv
  embed_mode:     gem   # GeM na L4 1x1: melhor leitura < 2000-d
  eval_set:       val
  stages:         [L4]

resources:
  gpu_ids:             [1]   # SVM: 1 por vez na maquina
  max_per_gpu:         1
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_disc_bp01w64c1280_pcts_gem

skip: state
