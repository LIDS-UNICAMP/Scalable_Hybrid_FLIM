# Igual ao eval_svm_layerwise5.yaml, mas o SVM ve a media de cada canal (avgpool2d) em vez do mapa achatado.
# SVM oficial sobre o encoder congelado de cada camada (L1..L5) da growth_layerwise5.
name:   svm_layerwise5_avg
method: autoencoder
runner: eval

grid:
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         layerwise5
  ckpt_selection: best
  embed_mode:     avgpool2d
  results_csv:    results/svm_layerwise5_avg.csv

resources:
  gpu_ids:             [2, 3]
  max_per_gpu:         2
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_layerwise5_avg

skip: state
