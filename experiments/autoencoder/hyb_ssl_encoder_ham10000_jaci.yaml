# Ponto de partida do estudo SSL (A_reports/november/ssl_exploracao/contexto_comum.md): o melhor SPiFiL pequeno de ham10000 com ENTRADA 200 px
# no restr5m (effnet_* e dwr_* excluidos: mudam a resolucao): ResNet (C-2C-4C-4C-4C-8C), 80-168-328-328-328-656 k3, 4,49 M, pools 2-2-2-2-1-1,
# com o protocolo de disc_md_restr5m_k3_obj_jaci.yaml, e o random_z da MESMA forma, salvos em formato FLIM (amostra.salvar_encoder).
# ESCOLHA PROVISORIA: kappa 0,507 so no split 1 com fpsw; nenhuma forma menor fica a 0,01 (312x6, 4,39 M, tem 0,495).
# fps pedido pelo orquestrador (melhor no HAM sem salienca), mas a 200 px no restr5m so o fpsw foi medido: os dois bracos vao, em diretorios proprios.
# Um YAML por base: salvar_encoder grava em <dir>/<braco>/<dataset>_split<s>_pct<p>, sem a lei no caminho.
# Fontes: o cache de restr5m_k3_obj vale a 50%; 100% ganha as suas (sufixo _pct100). As linhas do CSV sao a L0 dos runs SSL.
name: svm_hyb_ssl_encoder_ham10000_jaci
method: autoencoder
runner: eval
grid:
  datasets: [ham10000]
  splits: [1, 2, 3]
  percentages: [50, 100]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/hyb_ssl_encoder_ham10000
  results_csv: results/svm_hyb_ssl_encoder_ham10000_jaci
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/restr5m_k3_obj
    salvar_encoder: /dados/home/moliveira/exps/encoders/ssl_pequeno/ham10000
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [0]
    kernels: [3]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    tta: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: []  # no restr5m a largura real bateu com a pedida; um twin colidiria no mesmo diretorio random_z/
    leis:
      - {lei: W, w: "80-168-328-328-328-656", depth: 6}
resources:
  gpu_ids: [0]
  max_per_gpu: 8   # GPU_CAP_MIB=4200 por processo
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/hyb_ssl_encoder_ham10000
skip: state
