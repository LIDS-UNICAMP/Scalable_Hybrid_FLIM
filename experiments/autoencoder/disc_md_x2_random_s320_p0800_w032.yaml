# X2: ponto random, 800 px por superpixel, L1 = 32 filtros
name:   spifil_growth_disc_md_x2_random_s320_p0800_w032
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [flowers]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [3]
  max_per_gpu:         1
  cpus_per_experiment: 10

runner_args:
  layerwise:  1                   # so L1: decoder de 1 bloco
  impurities: true
  no_crop: true
  image_size: 320
  layer_channels: [32]
  layer_kernels:  [5]
  layer_pools:    [2]
  superpixels: disf
  n_superpixels: 128
  budget_check: false
  embed_mode: avgpool2d
  seed_point: random

output:
  work_dir: /exps/moliveira/spifil_growth/disc_md_x2_random_s320_p0800_w032

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 20
  trainer.max_epochs: 20
  model.init_args.warmup_epochs: 2
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 8
  model.init_args.epoch_probe: gem
  model.init_args.best_by_probe: true
