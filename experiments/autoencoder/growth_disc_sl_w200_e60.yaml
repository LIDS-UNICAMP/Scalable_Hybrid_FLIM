# lei de escala (w200): [64, 96, 128, 1920], sem aug, 60 ep; N esperado 713568 (1x1 limitada a 1920 < 2000-d; m=2 daria 2560)
name: spifil_growth_disc_sl_w200_e60
method: autoencoder
runner: growth
grid:
  init:
  - flim
  datasets:
  - helminth-larvae
  - protozoan-cysts
  splits:
  - 1
  - 2
  - 3
  percentages:
  - 50
resources:
  gpu_ids:
  - 2
  max_per_gpu: 1
  cpus_per_experiment: 10
  num_workers: 2
runner_args:
  layerwise: 4
  paper_classes: true
  layer_channels:
  - 64
  - 96
  - 128
  - 1920
  layer_kernels:
  - 5
  - 5
  - 5
  - 1
  layer_pools:
  - 2
  - 2
  - 2
  - 1
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_sl_w200_e60
wandb:
  enabled: true
  project: phd_thesis_layerwise
skip: state
evaluate:
  SVM: false
overrides:
  model.init_args.max_epochs: 60
  trainer.max_epochs: 60
  model.init_args.recon_bg_weight: 0.1
