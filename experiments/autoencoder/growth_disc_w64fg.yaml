# fg01 + largura 32/48/64 (uma mudanca vs fg01). w64 ganhou +0.011 em protozoan; fg01 estavel em larvae.
name:   spifil_growth_disc_w64fg
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [0, 1, 2]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  3
  paper_classes: true
  layer_channels: [32, 48, 64]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_w64fg

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1
