# Curva 1-100% da RECEITA SPiFiL (6 camadas x 256, k5, pools 2-2-2-2-1-1, 50 sp DISF, 200 px) treinada com o backprop layerwise do oficial (0.1, BCE, 200 epocas, paciencia 30, best por val/loss).
# Bases impuras Protozoan, Eggs, Larvae. Lacunas: o grow escolhe filtros com rotulo (1 por classe) e nao tem o whitening entre camadas da receita sem backprop.
# so troca bases e pcts. Avaliacao: eval_svm_hyb_curva_receita_{val,test}_gemttapwr.yaml depois do treino.
name:   spifil_growth_hyb_curva_receita_rand_jaci
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [Larvae, Eggs]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]   # 10 fora: core/constants.py PERCENTAGES nao tem 10

resources:
  gpu_ids:             [0]
  max_per_gpu:         4   # jaci: 96 GB, kitkat do root usa ~13 GB; 4 x 20 GB
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  6
  paper_classes: true
  impurities: true
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  layer_channels: [256, 256, 256, 256, 256, 256]
  layer_kernels:  [5, 5, 5, 5, 5, 5]
  layer_pools:    [2, 2, 2, 2, 1, 1]
  fill_random_last: false
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
  seed: 42
  random_layer_classic: true      # controle aleatorio puro

output:
  work_dir: /dados/home/moliveira/exps/spifil_growth/hyb_curva_receita_rand

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 2
  model.init_args.best_by_probe: false   # best por val/loss, sem rotulo nem teste
