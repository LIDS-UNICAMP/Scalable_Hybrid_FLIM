# Pool foco (rodada 2), varredura de resolucao <= nativa: receita sol_wsal (L6 256, entre_camadas, cat) com a entrada a 224 px. SAL-OFF (aid 600 px, remote_sensing 640 px nativos): so fps, sem saliencia.
# Superpixels fixos em 50 por imagem em toda resolucao (l1_superpixels; foco 400 so nos pontos de saliencia). Fontes por tamanho: o .pt de amostra.fontes nao leva o tamanho no nome.
# Ancora 200 px: mesma receita e sorteios nas rodadas anteriores. Controles aleatorios puros, sem tecnica. Piloto: split 1, sorteios 42 e 43.
name: svm_disc_md_pf_res224_off_b
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_pf_res224_off_b
  results_csv: /dados/home/moliveira/exps/results_sol/pool_foco/svm_disc_md_pf_res224_off_b
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [224]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    fontes: /dados/home/moliveira/exps/fontes_filtros/pf_res224_off_b
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    methods: [fps]
    controls: [random_z, orth]
    twin_controls: [random_z, orth]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_pf_res224_off_b
skip: state
