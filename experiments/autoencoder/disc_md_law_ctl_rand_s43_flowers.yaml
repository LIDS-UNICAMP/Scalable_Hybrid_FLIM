# Controle aleatorio, amostra B0: par do F0 semente 43.
name:   spifil_growth_disc_md_law_ctl_rand_s43_flowers
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [flowers]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [1]
  max_per_gpu:         1
  cpus_per_experiment: 10

runner_args:
  layerwise:  4
  impurities: true                # mascara desligada no grow
  image_size: 200
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  random_layer: true              # controle: mesma forma, filtros sorteados
  layer_channels: [30, 50, 65, 1280]  # B0 de P4: multiplo de C
  layer_kernels:  [5, 5, 5, 1]
  layer_pools:    [2, 2, 2, 1]
  fill_random_last: true          # 50 sp por imagem nao enchem a L4; resto aleatorio
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d           # sem SVM no treino; so preenche o hparam
  layerwise_backprop: 0.1
  seed: 43
  reg_loss: {name: weak_sigreg, lambda: 0.01}

output:
  work_dir: /exps/moliveira/spifil_growth/disc_md_law_ctl_rand_s43_flowers

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 43
  model.init_args.seed: 43
  model.init_args.max_epochs: 60
  trainer.max_epochs: 60
  model.init_args.recon_bg_weight: 1.0   # oficial _bg1
  data.init_args.num_workers: 8
  model.init_args.best_by_probe: false   # checkpoint por val_recon_loss, sem rotulo
