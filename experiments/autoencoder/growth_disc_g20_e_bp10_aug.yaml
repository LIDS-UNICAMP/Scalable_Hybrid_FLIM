# combinacao (uma mudanca contra e_aug e contra e_bp10): bp 1.0 + geo_aug, eggs, 200 ep. Com gem_tta: e_bp10 0.925 e e_aug 0.920 somaram separados sobre a base 0.912
name: spifil_growth_disc_g20_e_bp10_aug
method: autoencoder
runner: growth
grid:
  init:
  - flim
  datasets:
  - helminth-eggs
  splits:
  - 1
  - 2
  - 3
  percentages:
  - 50
resources:
  gpu_ids:
  - 2
  max_per_gpu: 1
  cpus_per_experiment: 10
  num_workers: 2
runner_args:
  layerwise: 4
  paper_classes: true
  layer_channels:
  - 32
  - 48
  - 64
  - 1280
  layer_kernels:
  - 5
  - 5
  - 5
  - 1
  layer_pools:
  - 2
  - 2
  - 2
  - 1
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: gem
  layerwise_backprop: 1.0
output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_g20_e_bp10_aug
wandb:
  enabled: true
  project: phd_thesis_layerwise
skip: state
evaluate:
  SVM: false
overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1
  data.init_args.geo_aug: true
