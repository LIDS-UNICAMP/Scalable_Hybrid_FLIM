# H3: redundancia do banco sem rotulo contra o peso da maior classe; flowers reamostrado de proposito.
name: svm_disc_md_amostra_imb_flowers
method: autoencoder
runner: eval
grid:
  datasets: [flowers]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: l1_sem_rotulo
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_amostra_imb
  results_csv: results/svm_disc_md_amostra_imb
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow: {}
  amostra:
    modo: desbalanceio
    images: 150
    widths: [64]
    draws: [42, 43, 44]
    shares: [0.2, 0.4, 0.6, 0.8, 0.95]
    methods: [uniform, fps, kmeans]
    kernels: [5]
resources:
  gpu_ids: [0]
  max_per_gpu: 1
  cpus_per_experiment: 4
output:
  work_dir: /exps/moliveira/eval/disc_md_amostra_imb_flowers
skip: state
