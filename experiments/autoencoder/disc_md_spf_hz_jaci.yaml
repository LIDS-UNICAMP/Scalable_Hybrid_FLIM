# Hipotese do fundo (c): a mesma imagem com o fundo zerado pelo label [oraculo]; par da grade h.
name: svm_disc_md_spf_hz
method: autoencoder
runner: eval
grid:
  datasets: [Protozoan_subgroup, Eggs_subgroup, Larvae_subgroup, Larvae, Eggs, Protozoan]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_spf_hz
  results_csv: results/svm_disc_md_spf_hz
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    shards: 1
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [64, 256]
    kernels: [5]
    depth: 3
    pool: 2
    methods: [spifil, crus, zca2]
    controls: [random_z, orth, he, whrand]
    fundo: zerado
    twin_controls: [random_z, orth, whrand]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_spf_hz
skip: state
