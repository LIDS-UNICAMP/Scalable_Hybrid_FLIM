# TESTE de L3 ResNet 4,5 M em aid (configuracao fixada na validacao; o teste so mede, nao escolhe nada). 50% e 100%, 3 splits.
name: svm_disc_md_teste_aid_restr5m_45M
method: autoencoder
runner: eval
grid:
  datasets: [aid]
  splits: [1, 2, 3]
  percentages: [50, 100]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_teste_aid_restr5m_45M
  results_csv: results/svm_disc_md_teste_aid_restr5m_45M
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    avaliar: test
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/teste_aid_restr5m_45M
    shards: 1
    svm_workers: 1
    images: 500
    draws: [42]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    tta: true
    methods: [fps]
    controls: [random_z]
    twin_controls: [random_z]
    widths: [0]
    kernels: [3]
    leis:
      - {lei: W, w: "56-112-216-432-432-432", depth: 6}
resources:
  gpu_ids: [3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_teste_aid_restr5m_45M
skip: state
