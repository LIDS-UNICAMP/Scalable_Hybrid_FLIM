# Avaliacao PARCIAL pedida pelo usuario: camada 6 (final) ja treinada com backprop (Protozoan split 1, 1% e 5%), para ver como esta; nao e o resultado final.
# SVM da curva do hibrido (hyb_curva_receita.yaml), leitura final gem + TTA + whitening, conjunto: val. Rodar so depois do treino.
name: svm_hyb_curva_receita_parcial_L6
method: autoencoder
runner: eval
grid:
  datasets: [Protozoan]
  splits: [1]
  percentages: [5]
runner_args:
  probe: svm
  source: growth_stages
  family: hyb_curva_receita
  artifacts_dir: /exps/moliveira/eval/espelho_growth
  ckpt_selection: best
  results_csv: results/svm_hyb_curva_receita_parcial_L6_p5.csv
  embed_mode: gem_tta_pw
  eval_set: val
  stages: [L6]
resources:
  gpu_ids: [0]
  max_per_gpu: 1   # SVM um por vez (CPU satura)
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/eval/svm_hyb_curva_receita_parcial_L6
skip: state
