# Curva do HAM refeita nos pontos que leram as fontes erradas: o cache de fontes nao tinha a porcentagem na chave e os splits 2 e 3 (5-100%) leram as do pct1 (50 imagens).
# Split 1 e os pct1 calcularam as proprias e ficam. 100% esta em disc_md_receita_tta_ham100.yaml. Fontes em pasta nova: a chave de 50% e a antiga e apontaria para o cache do pct1.
name: svm_disc_md_receita_tta_ham_fix
method: autoencoder
runner: eval
grid:
  datasets: [ham10000]
  splits: [2, 3]
  percentages: [5, 25, 50, 75]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_receita_tta_ham_fix
  results_csv: results/svm_disc_md_receita_tta_ham_fix
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/receita_tta_ham_fix
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    tta: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: [random_z]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 2
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_receita_tta_ham_fix
skip: state
