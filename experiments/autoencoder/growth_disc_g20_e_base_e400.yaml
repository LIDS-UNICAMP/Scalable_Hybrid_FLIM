# lei do orcamento em eggs: 60 ep 0.875 < 200 ep 0.899, e o best das L1-L3 cai no fim do cosine (ep ~195/200) = ainda subindo; 400 ep e o proximo ponto
name: spifil_growth_disc_g20_e_base_e400
method: autoencoder
runner: growth
grid:
  init:
  - flim
  datasets:
  - helminth-eggs
  splits:
  - 1
  - 2
  - 3
  percentages:
  - 50
resources:
  gpu_ids:
  - 3
  max_per_gpu: 1
  cpus_per_experiment: 10
  num_workers: 2
runner_args:
  layerwise: 4
  paper_classes: true
  layer_channels:
  - 32
  - 48
  - 64
  - 1280
  layer_kernels:
  - 5
  - 5
  - 5
  - 1
  layer_pools:
  - 2
  - 2
  - 2
  - 1
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_g20_e_base_e400
wandb:
  enabled: true
  project: phd_thesis_layerwise
skip: state
evaluate:
  SVM: false
overrides:
  model.init_args.max_epochs: 400
  trainer.max_epochs: 400
  model.init_args.recon_bg_weight: 0.1
