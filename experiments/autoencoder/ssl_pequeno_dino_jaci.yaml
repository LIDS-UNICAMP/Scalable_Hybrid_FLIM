# SSL DINOv2 sem iBOT (losses/dino.py) sobre os encoders PEQUENOS (<= 5 M), 200 px em todas as bases.
# Encoders: /dados/home/moliveira/exps/encoders/ssl_pequeno/<base>/<arm>/<dataset>_split<s>_pct<p> (montados por outro agente);
# a profundidade (L<n>) sai do architecture.json de cada um (layerwise: auto).
# Perda: DINO (professor EMA encoder+DINOHead 512-128-2048, momento cosseno 0,996->1 por passo, so as 2 globais; Sinkhorn; T aluno 0,1, T professor 0,04->0,07 nos primeiros 10% de max_epochs) + 0,1*KoLeo no GeM das globais. Cabeca descartada na avaliacao.
# Vistas: 2 globais 200 px (crop 0,3-1,0) + 6 locais 96 px (0,05-0,3), flip, jitter LAB p 0,8, cinza 0,2, blur 0,5, solarize L 0,2.
# Ajuste fino: AdamW lr 5e-5, wd 5e-4, bf16-mixed, lote 64; warmup 3 epocas, lr constante + ReduceLROnPlateau (x0,5, paciencia 1/3, min 1e-6).
# Ate 1000 epocas; EarlyStopping so na val_ssl_loss, paciencia de 3000 PASSOS convertida em epocas por base, melhora minima 0,5% relativa;
# vistas de validacao fixas (val_seed). Checkpoint oficial = menor val_ssl_loss (best_kappa.ckpt) + last.ckpt; L0 = encoder intacto.
# Zero rotulo no treino e na escolha; a sonda kappa por epoca so e gravada. HAM10000 a 100%: validation == train (core/data/splits.py:9),
# a val_ssl_loss e a sonda dele leem o treino; o SVM dele a 100% e so no teste.
# Braco RECEITA: o nome do braco por base em init_flim_dir e o palpite da melhor receita: CONFERIR com as pastas do ssl_pequeno.
name:   spifil_growth_ssl_pequeno_dino_jaci
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [Protozoan, Eggs, Larvae, ham10000, aid, remote_sensing, coconut_trees, flowers]
  splits:      [1, 2, 3]
  percentages: [50, 100]

resources:
  gpu_ids:             [0]
  max_per_gpu:         3   # bf16, lote 48: 10 GB no modelo de 8 M (smoke athena); os pequenos cabem 3 x < 76 GB
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  init_flim_dir:
    Protozoan: /dados/home/moliveira/exps/encoders/ssl_pequeno/Protozoan/fpsw@mapa_w0.5_1
    Eggs: /dados/home/moliveira/exps/encoders/ssl_pequeno/Eggs/fpsw@mapa_w0.5_1
    Larvae: /dados/home/moliveira/exps/encoders/ssl_pequeno/Larvae/fpsw@mapa_w0.5_1
    ham10000: /dados/home/moliveira/exps/encoders/ssl_pequeno/ham10000/fps
    aid: /dados/home/moliveira/exps/encoders/ssl_pequeno/aid/fps
    remote_sensing: /dados/home/moliveira/exps/encoders/ssl_pequeno/remote_sensing/fps
    coconut_trees: /dados/home/moliveira/exps/encoders/ssl_pequeno/coconut_trees/fps
    flowers: /dados/home/moliveira/exps/encoders/ssl_pequeno/flowers/fpsw@mapa_w0.5_1
  layerwise:  auto                # profundidade do architecture.json de cada encoder
  layerwise_from_flim: auto       # todas as camadas vem do encoder pronto; um estagio L<n> com tudo solto
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  embed_mode: avgpool2d
  seed: 42
  train_aug: {p: 0.8, l_jitter: 0.2, ab_jitter: 0.02, stain: 0.2}   # so o jitter de cor; crop, flip, cinza, blur e solarize vem do lejepa
  lejepa: {objective: dino, n_prototypes: 2048, dino_hidden: 512, dino_bottleneck: 128, sinkhorn: true, koleo: 0.1, lam: 0.05, sigreg_type: real, num_slices: 1024, head: mlp, proj_hidden: 2048, proj_dim: 64, global_views: 2, global_size: 200, global_scale: [0.3, 1.0], local_views: 6, local_size: 96, local_scale: [0.05, 0.3], gray: 0.2, blur: 0.5, solarize: 0.2,
          val_seed: 1234, patience_steps: 3000, min_delta_rel: 0.005, plateau_factor: 0.5, min_lr: 1.0e-6, save_last: true}

output:
  work_dir: /dados/home/moliveira/exps/spifil_growth/ssl_pequeno_dino

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 1000        # teto; quem para e o EarlyStopping na val_ssl_loss
  trainer.max_epochs: 1000
  trainer.precision: bf16-mixed
  model.init_args.lr: 5.0e-5
  model.init_args.weight_decay: 5.0e-4
  model.init_args.warmup_epochs: 3
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 2
  data.init_args.batch_size: 64
  model.init_args.epoch_probe: gem
  model.init_args.best_by_probe: false
  model.init_args.ckpt_last: false         # sem rotulo: best = menor val_ssl_loss (+ last.ckpt); a sonda por epoca so e gravada
