# eggs-diag (A4, 02/11): 99% dos erros de eggs sao ovo <-> impureza (218/220); com paper_classes a impureza nao ganha semente SPiFiL
# e_imp: SPiFiL com 1 imagem da impureza (classe 9): filtros que respondem a impureza separam ovo x impureza. paper_classes false tambem troca as 2 imagens do artigo por sorteio
name: spifil_growth_disc_g20_e_imp_e60
method: autoencoder
runner: growth
grid:
  init:
  - flim
  datasets:
  - helminth-eggs
  splits:
  - 1
  - 2
  - 3
  percentages:
  - 50
resources:
  gpu_ids:
  - 3
  max_per_gpu: 1
  cpus_per_experiment: 10
  num_workers: 2
runner_args:
  layerwise: 4
  paper_classes: false
  layer_channels:
  - 32
  - 48
  - 64
  - 1280
  layer_kernels:
  - 5
  - 5
  - 5
  - 1
  layer_pools:
  - 2
  - 2
  - 2
  - 1
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_g20_e_imp_e60
wandb:
  enabled: true
  project: phd_thesis_layerwise
skip: state
evaluate:
  SVM: false
overrides:
  model.init_args.max_epochs: 60
  trainer.max_epochs: 60
  model.init_args.recon_bg_weight: 0.1
