# Profundidade sem backprop: rede de 8 camadas lida em cada camada; pools todos no comeco, o mapa para em 11.
name: svm_disc_md_spfdeep_cedo
method: autoencoder
runner: eval
grid:
  datasets: [Protozoan_subgroup, flowers, Eggs_subgroup, Larvae_subgroup, helminth_eggs, aid]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_spfdeep_cedo
  results_csv: results/svm_disc_md_spfdeep_cedo
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [64, 256]
    kernels: [5]
    depth: 8
    pool: [2, 2, 2, 2, 1, 1, 1, 1]
    methods: [crus@geodesic, crus@obj, crus@sift_nms, fps@sift, fps, spifil]
    controls: [orth, xavier, tnorm, random_z]
    twin_controls: [orth, xavier, random_z]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: {0: 2, 1: 2, 2: 1, 3: 1}
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_spfdeep_cedo
skip: state
