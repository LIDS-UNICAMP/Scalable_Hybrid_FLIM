# disc_bp01w64c1280 + feat_whiten (ZCA de canal antes de cada conv, Network Deconvolution).
# Base de referencia; a unica mudanca e model.init_args.feat_whiten.
name:   spifil_growth_disc_nd_e200
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [0]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  4
  paper_classes: true
  layer_channels: [32, 48, 64, 1280]
  layer_kernels:  [5, 5, 5, 1]
  layer_pools:    [2, 2, 2, 1]   # L4 sem pooling: mantem 24x24
  fill_random_last: true          # 50 sp por imagem -> 100..400 filtros SPiFiL; resto aleatorio
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d           # 1280x24x24 achatado = 737k-d, inviavel no kappa de treino
  layerwise_backprop: 0.1

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_nd_e200

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1   # base nova: fundo pesa 0.1 (achado L2 fundo)
  model.init_args.feat_whiten: true
