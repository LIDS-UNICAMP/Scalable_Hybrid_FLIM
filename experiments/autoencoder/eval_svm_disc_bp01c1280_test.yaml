# SVM de checagem sobre cada camada da growth_disc_bp01c1280.
name:   svm_disc_bp01c1280_test
method: autoencoder
runner: eval

grid:
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         disc_bp01c1280
  ckpt_selection: best
  results_csv:    results/svm_disc_bp01c1280_test.csv
  embed_mode:     avgpool2d   # media por canal: 1280-d na L4, 48-d na L3
  eval_set:       test   # twin de teste: so relatorio; selecao fica na val
  stages:         [L3, L4]   # L3 na mesma leitura media = referencia da camada 1x1

resources:
  gpu_ids:             [1]   # SVM: 1 por vez na maquina
  max_per_gpu:         1
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_disc_bp01c1280_test

skip: state
