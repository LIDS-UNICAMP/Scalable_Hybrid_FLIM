# VLAD na ultima camada (vlad16_eq, vlad32_eq: PCA a dimensao de `cat`) contra GeM (L, cat); bases de cena, braco fps sem saliencia. Receita L6, 256, entre_camadas.
name: svm_disc_md_vlad_off
method: autoencoder
runner: eval
grid:
  datasets: [aid, remote_sensing]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_vlad_off
  results_csv: /dados/home/moliveira/exps/results_sol/pool_foco/svm_disc_md_vlad_off
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    fontes: /dados/home/moliveira/exps/fontes_filtros/disc_md_vlad_off
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    leituras: [gem, vlad16, vlad32]
    methods: [fps]
    controls: [random_z, orth]
    twin_controls: [random_z, orth]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_vlad_off
skip: state
