# Curva de aprendizado do hibrido oficial disc_bp01w64c1280_bg1 nas bases IMPURAS (Protozoan, Eggs, Larvae).
# Igual a hyb_ham10000_oficial.yaml (growth layerwise 4 camadas 32/48/64/1280, backprop 0.1, BCE plana, 200 epocas),
# so troca bases e pcts. Avaliacao: eval_svm_hyb_curva_parasitos_{val,test}_gemttapwr.yaml depois do treino.
name:   spifil_growth_hyb_curva_parasitos
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [Protozoan, Eggs, Larvae]
  splits:      [1, 2, 3]
  percentages: [1, 5, 25, 50, 75, 100]   # 10 fora: core/constants.py PERCENTAGES nao tem 10

resources:
  gpu_ids:             [0, 1, 2, 3]
  max_per_gpu:         4   # GPU_CAP_MIB=6000 por job -> 4 x 6 GB = 24 GB < 25 GB por GPU
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  4
  paper_classes: true
  impurities: true
  image_size: 200
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  layer_channels: [32, 48, 64, 1280]
  layer_kernels:  [5, 5, 5, 1]
  layer_pools:    [2, 2, 2, 1]
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
  seed: 42

output:
  work_dir: /exps/moliveira/spifil_growth/hyb_curva_parasitos

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 2
  model.init_args.best_by_probe: false   # best por val/loss, sem rotulo nem teste
