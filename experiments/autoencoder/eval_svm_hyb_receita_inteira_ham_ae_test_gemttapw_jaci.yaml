# HAM10000 AE (receita fps): SVM do hyb_receita_inteira_ham_ae_jaci.yaml, estagios L0 (encoder intacto) e L6 (ultima epoca), leitura gem_tta_pw, conjunto test. So depois do treino.
# 50% e 100%; a 100% este e o unico numero que vale.
name: svm_hyb_receita_inteira_ham_ae_test_gemttapw_jaci
method: autoencoder
runner: eval
grid:
  datasets: [ham10000]
  splits: [1, 2, 3]
  percentages: [50, 100]
runner_args:
  probe: svm
  source: growth_stages
  family: hyb_receita_inteira_ham_ae
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth
  ckpt_selection: best   # o arquivo best_kappa.ckpt guarda a ULTIMA epoca (ckpt_last)
  results_csv: results/svm_hyb_receita_inteira_ham_ae_test_gemttapw_jaci.csv
  embed_mode: gem_tta_pw
  eval_set: test
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  stages: [L0, L6]
resources:
  gpu_ids: [0]
  max_per_gpu: 1   # SVM um por vez (CPU satura)
  cpus_per_experiment: 8
output:
  work_dir: /dados/home/moliveira/exps/eval/svm_hyb_receita_inteira_ham_ae_test_gemttapw_jaci
skip: state
