# Fila 2 (E04, E05): homeostase no SoftHebb, so na competicao; random e fps, 64 e 256, 300 passos. O par sem
# homeostase (mesmo split, sorteio e lotes) e a Fila 1 (disc_md_sol_hebb1). E04 vies pela frequencia; E05 so inativos.
# 6 bases, split 1, sorteio 42, 1 processo por vez. As fontes SPiFiL sao as do sorteio em ms_fontes (500 imagens).
name: svm_disc_md_sol_hebb2_piloto
method: autoencoder
runner: eval
grid:
  datasets: [flowers, aid, remote_sensing, Eggs_subgroup, Larvae_subgroup, Protozoan_subgroup]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: alt_encoders
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_sol_hebb2_piloto
  results_csv: /exps/moliveira/results_sol/alternative_encoders/svm_disc_md_sol_hebb2_piloto
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    draws: [42]
    fontes: /exps/moliveira/fontes_filtros/ms
    hebb_init: {inits: [], homeo_inits: [random, fps], widths: [64, 256], depth: 3, kernel: 5, pool: 2, steps: [300],
                batch: 8, images: 2000, lr: 0.05, inv_temp: 4.0, bank_images: 500, readouts: [gem_pw],
                homeo: {e04: {gain: 0.5, cap: 2.0, decay: 0.99}, e05: {window: 30, patience: 2, boost: 0.5}}}
resources:
  gpu_ids: [2]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_sol_hebb2_piloto
skip: state
