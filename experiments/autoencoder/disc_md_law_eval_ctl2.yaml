# SVM de validacao do controle aleatorio, sementes 43 e 44.
name: svm_disc_md_law_eval_ctl2
method: autoencoder
runner: eval
grid:
  datasets: [flowers, helminth_larvae]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  artifacts_dir: /exps/moliveira/spifil_growth
  family: disc_md_law_ctl_rand_s4[34]_*
  ckpt_selection: best
  results_csv: results/svm_disc_md_law_eval_ctl2.csv
  embed_mode: gem_tta_pw
  eval_set: val
  stages: [L4]
  image_size: 200
  no_crop: true
resources:
  gpu_ids: [3]
  max_per_gpu: 1
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/eval/disc_md_law_eval_ctl2
skip: state
