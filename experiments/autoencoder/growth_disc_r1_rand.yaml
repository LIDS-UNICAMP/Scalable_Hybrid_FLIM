# Controle do R1: random_layer (pareado: mesmo shape, mesma norma por filtro, so a
# direcao aleatoria), seed 42. Prova se o SPiFiL contribui como inicializador (estabilidade).
name:   spifil_growth_disc_r1_rand
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [3]
  max_per_gpu:         2
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  3
  random_layer: true
  seed: 42
  paper_classes: true
  layer_channels: [24, 32, 48]
  kernel_size: 5
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: flatten

output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_r1_rand

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
