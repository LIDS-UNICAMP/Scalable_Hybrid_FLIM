# g20 l_w96: base mais larga sob a 1x1  | split 1 ja pronto (pausado 17:10, cap 20 GB)
name: spifil_growth_disc_g20_l_w96
method: autoencoder
runner: growth
grid:
  init:
  - flim
  datasets:
  - helminth-larvae
  splits:
  - 2
  - 3
  percentages:
  - 50
resources:
  gpu_ids:
  - 1
  max_per_gpu: 1
  cpus_per_experiment: 10
  num_workers: 2
runner_args:
  layerwise: 4
  paper_classes: true
  layer_channels:
  - 48
  - 64
  - 96
  - 1280
  layer_kernels:
  - 5
  - 5
  - 5
  - 1
  layer_pools:
  - 2
  - 2
  - 2
  - 1
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_g20_l_w96
wandb:
  enabled: true
  project: phd_thesis_layerwise
skip: state
evaluate:
  SVM: false
overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1
