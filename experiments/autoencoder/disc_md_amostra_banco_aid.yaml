# Parte 4: banco sem classe nem numero de classes, 3 camadas sem backprop, escolha refeita nos mapas.
name: svm_disc_md_amostra_banco_aid
method: autoencoder
runner: eval
grid:
  datasets: [aid]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: l1_sem_rotulo
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_amostra_banco
  results_csv: results/svm_disc_md_amostra_banco
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow: {}
  amostra:
    images: 500
    draws: [42, 43]
    widths: [32, 64, 128, 256]
    methods: [rand, uniform, fps, qr, dpp, cos_prune, gs, hdbscan, kmeans_sil, gmm_bic, meanshift, affinity]
    channels: [0, 60, 60]   # B0 de P4; 0 = a largura da celula
    kernels: [5, 5, 5]
    pools: [2, 2, 2]
    depth: 3
resources:
  gpu_ids: [0, 3]
  max_per_gpu: {0: 1, 3: 2}
  cpus_per_experiment: 4
output:
  work_dir: /exps/moliveira/eval/disc_md_amostra_banco_aid
skip: state
