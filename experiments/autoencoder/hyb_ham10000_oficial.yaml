# HAM10000 a 50% com o modelo oficial disc_bp01w64c1280_bg1 EXATAMENTE como ele e
# (growth layerwise 4 camadas 32/48/64/1280, backprop 0.1 nas antigas, BCE plana, 200 epocas).
# So o que o HAM exige muda: imagem 200 letterbox, cache, sem mascara. Athena, 1 job por GPU.
name:   spifil_growth_hyb_ham10000_oficial
method: autoencoder
runner: growth

grid:
  init:        [flim]
  datasets:    [ham10000]
  splits:      [1, 2, 3]
  percentages: [50]

resources:
  gpu_ids:             [0, 1, 2, 3]
  max_per_gpu:         1
  cpus_per_experiment: 10
  num_workers:         2

runner_args:
  layerwise:  4
  paper_classes: true
  impurities: true                # HAM sem mascara de segmentacao aqui
  image_size: 200
  no_crop: true
  image_cache_dir: /exps/moliveira/image_cache
  layer_channels: [32, 48, 64, 1280]
  layer_kernels:  [5, 5, 5, 1]
  layer_pools:    [2, 2, 2, 1]
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: avgpool2d
  layerwise_backprop: 0.1
  seed: 42

output:
  work_dir: /exps/moliveira/spifil_growth/hyb_ham10000_oficial

wandb:
  enabled: true
  project: phd_thesis_layerwise

skip: state

evaluate:
  SVM: false

overrides:
  seed_everything: 42
  model.init_args.seed: 42
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 1.0
  data.init_args.num_workers: 2
  model.init_args.best_by_probe: false   # best por val/loss, sem rotulo nem teste
