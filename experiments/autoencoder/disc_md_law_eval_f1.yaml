# SVM de validacao de F1 degrau 1: ranking de perda e lambda.
name: svm_disc_md_law_eval_f1
method: autoencoder
runner: eval
grid:
  datasets: [flowers, helminth_eggs, helminth_larvae]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  artifacts_dir: /exps/moliveira/spifil_growth
  family: disc_md_law_f1_*
  ckpt_selection: best
  results_csv: results/svm_disc_md_law_eval_f1.csv
  embed_mode: gem_tta_pw
  eval_set: val
  stages: [L4]
  image_size: 200
  no_crop: true
resources:
  gpu_ids: [3]
  max_per_gpu: 1
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/eval/disc_md_law_eval_f1
skip: state
