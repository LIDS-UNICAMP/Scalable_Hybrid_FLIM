# SVM de checagem sobre cada camada da growth_disc_a2_bp01.
name:   svm_disc_a2_bp01_val
method: autoencoder
runner: eval

grid:
  datasets:    [helminth-eggs, helminth-larvae, protozoan-cysts]
  splits:      [1, 2, 3]
  percentages: [50]

runner_args:
  probe:          svm
  source:         growth_stages
  family:         disc_a2_bp01
  ckpt_selection: best
  results_csv:    results/svm_disc_a2_bp01_val.csv
  embed_mode:     flatten
  eval_set:       val

resources:
  gpu_ids:             [0, 1, 2]
  max_per_gpu:         1
  cpus_per_experiment: 8

output:
  work_dir: /dados/home/moliveira/artifacts/eval/svm_disc_a2_bp01_val

skip: state
