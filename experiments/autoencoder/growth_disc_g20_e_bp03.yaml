# g20 e_bp03: camadas antigas acompanham mais o filtro SPiFiL novo
name: spifil_growth_disc_g20_e_bp03
method: autoencoder
runner: growth
grid:
  init:
  - flim
  datasets:
  - helminth-eggs
  splits:
  - 1
  - 2
  - 3
  percentages:
  - 50
resources:
  gpu_ids:
  - 0
  max_per_gpu: 1
  cpus_per_experiment: 10
  num_workers: 2
runner_args:
  layerwise: 4
  paper_classes: true
  layer_channels:
  - 32
  - 48
  - 64
  - 1280
  layer_kernels:
  - 5
  - 5
  - 5
  - 1
  layer_pools:
  - 2
  - 2
  - 2
  - 1
  fill_random_last: true
  superpixels: disf
  n_superpixels: 50
  budget_check: false
  embed_mode: gem
  layerwise_backprop: 0.3
output:
  work_dir: /dados/home/moliveira/artifacts/spifil_growth/disc_g20_e_bp03
wandb:
  enabled: true
  project: phd_thesis_layerwise
skip: state
evaluate:
  SVM: false
overrides:
  model.init_args.max_epochs: 200
  trainer.max_epochs: 200
  model.init_args.recon_bg_weight: 0.1
