# Multiescala, rodada B nas demais 7 bases.
name: svm_disc_md_ms_b2
method: autoencoder
runner: eval
grid:
  datasets: [Eggs, Protozoan, Larvae, protozoan_cysts, remote_sensing, helminth_eggs, helminth_larvae]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_ms_b2
  results_csv: results/svm_disc_md_ms_b2
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    multiescala: true
    fontes: /dados/home/moliveira/exps/tmp/ms_fontes
    shards: 1
    svm_workers: 1
    images: 500
    draws: [42, 43, 44, 45, 46]
    widths: [64]
    kernels: [5]
    depth: 3
    pool: 2
    methods: [crus@centroid, crus@sift_nms, crus@obj, fps@geodesic]
    controls: []
    twin_controls: [xavier, random_z]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_ms_b2
skip: state
