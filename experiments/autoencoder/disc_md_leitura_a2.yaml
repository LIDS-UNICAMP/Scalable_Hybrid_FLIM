# Rodada 2, teste A0/A1/A2: o ganho de cat_ms vem da escala ou so da dimensao? L_ms_eq e cat_ms_eq (amostra.eq)
# sao ms reduzidos por PCA (fitada so no treino) a dimensao de L e cat. As celulas A0/A1 (L, L_gem_p2, L_ms, cat,
# cat_gem_p2, cat_ms) repetem sol_p5 so como ancora pareada; remote_sensing e as leituras _eq sao o que e novo.
name: svm_disc_md_leitura_a2
method: autoencoder
runner: eval
grid:
  datasets: [Eggs_subgroup, Protozoan_subgroup, Larvae_subgroup, aid, flowers, remote_sensing]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_leitura_a2
  results_csv: /exps/moliveira/results_sol/pooling/svm_disc_md_leitura_a2
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    fontes: /exps/moliveira/fontes_filtros/leitura_a2
    shards: 1
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [64, 256]
    kernels: [5]
    depth: 3
    pool: 2
    leituras: [gem, gem_p2, ms]
    eq: true
    methods: [fps]
    controls: [random_z, xavier, orth]
resources:
  gpu_ids: [2, 3]
  max_per_gpu: 2
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_leitura_a2
skip: state
