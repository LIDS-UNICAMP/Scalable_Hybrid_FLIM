# Familia de crescimento SPiFiL: g5_head
# Controle com fine-tune da cabeca, crescimento guiado por superpixel na IMAGEM.
#
# RECONSTRUIDO a partir de logs/g5_head.log e de artifacts/spifil_growth/g5_head/.
# Os knobs de grow nao sao gravados no run_metadata.json, entao vieram das flags
# do log. Rode com --dry-run e confira antes da primeira vez.

name:   g5_head
method: autoencoder
runner: growth

grid:
  init: [flim]
  datasets:
    - helminth-eggs
    - helminth-larvae
    - protozoan-cysts
  splits: [1, 2, 3]
  percentages: [5, 50]

resources:
  # --gpus 1 2 3
  gpu_ids:             [1, 2, 3]
  # --max-concurrent-per-gpu 3 (9 bracos simultaneos)
  max_per_gpu:         3
  # --cpus-per-experiment 10; vira OMP_NUM_THREADS do filho e num_cpus da task Ray
  cpus_per_experiment: 10
  # --num-workers 2. ATENCAO: o schema valida (schema.py:175) mas nenhum runner
  # traduz isso em override hoje; ver a secao de achados do relatorio E1-E4.
  num_workers:         2

runner_args:
  max_rounds:      2
  kappa_tolerance: 0.01
  rounds_patience: 1
  embed_mode:      flatten
  head_finetune: true
  impurities: true
  one_per_class: true
  spifil_in_image: true

output:
  work_dir: artifacts/spifil_growth/g5_head

wandb:
  enabled: true
  project: phd_thesis_g5_head

skip: state
