# So a L1 SPiFiL, sem treino: lei tamanho da imagem x superpixels, lida direto no teste (pedido do usuario).
name: svm_disc_md_l1fast
method: autoencoder
runner: eval
grid:
  datasets: [Larvae_subgroup, remote_sensing, Larvae, helminth_larvae, flowers, Eggs_subgroup, helminth_eggs, Protozoan_subgroup, protozoan_cysts, Eggs, aid]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: l1_fast
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_l1fast
  results_csv: results/svm_disc_md_l1fast
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [64, 96, 128, 200, 256, 320, 448, 640]
  l1_superpixels: [12, 25, 50, 100, 200, 400, 800, 1600]
  l1_random: [100]
  l1_grow:
    out_channels: 64
    kernel_size: 5
    pool_stride: 2
    impurities: true
    superpixels: disf
    budget_check: false
resources:
  gpu_ids: [0, 1, 2]
  max_per_gpu: 2
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/eval/disc_md_l1fast
skip: state
