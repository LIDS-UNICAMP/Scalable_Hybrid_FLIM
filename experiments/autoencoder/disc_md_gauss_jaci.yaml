# Saliência gaussiana (pedido de 08/11): o peso de cada ponto vem de uma gaussiana com o centro e a covariância do mapa gmr, alargada k = 1, 2, 3; compara com o corte 0,5 da receita.
# Whitening entre camadas + saliencia gmr (peso na selecao e foco dos superpixels), juntos pela primeira vez; 12 bases, sem mascara real.
name: svm_disc_md_gauss
method: autoencoder
runner: eval
grid:
  datasets: [Larvae_subgroup, Protozoan_subgroup, Eggs_subgroup, flowers, aid, helminth_eggs, Larvae, Protozoan, Eggs, protozoan_cysts, helminth_larvae, remote_sensing]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_gauss
  results_csv: results/svm_disc_md_gauss
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0.5], g: [1], foco: 400, gauss: [1, 2, 3]}
    fontes: /dados/home/moliveira/exps/tmp/gauss_fontes
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [64, 256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1, fpsw@mapa_gauss1, fpsw@mapa_gauss2, fpsw@mapa_gauss3, fps@foco_w0.5_1, fps@foco_gauss1, fps@foco_gauss2, fps@foco_gauss3]
    controls: [orth, xavier, tnorm, random_z]
    twin_controls: [orth, xavier, random_z]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_gauss
skip: state
