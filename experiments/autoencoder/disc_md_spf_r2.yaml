# Rodada 2: quem sobrou de r1 sobe para 512 e 1024, sempre em par com o aleatorio.
name: svm_disc_md_spf_r2
method: autoencoder
runner: eval
grid:
  datasets: [flowers, Protozoan_subgroup]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_spf_r2
  results_csv: results/svm_disc_md_spf_r2
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    shards: 4
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [512, 1024]
    kernels: [5]
    depth: 3
    pool: 2
    survivors: r1
    top: 6
    twin_controls: [random_z, orth, whrand]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 2
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_spf_r2
skip: state
