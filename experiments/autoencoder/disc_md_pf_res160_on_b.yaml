# Pool foco (rodada 2), varredura de resolucao <= nativa: receita sol_wsal (L6 256, entre_camadas, cat) com a entrada a 160 px. SAL-ON (Eggs 272 px nativos): braco fpsw@mapa_w0.5_1.
# Superpixels fixos em 50 por imagem em toda resolucao (l1_superpixels; foco 400 so nos pontos de saliencia). Fontes por tamanho: o .pt de amostra.fontes nao leva o tamanho no nome.
# Ancora 200 px: mesma receita e sorteios nas rodadas anteriores. Controles aleatorios puros, sem tecnica. Piloto: split 1, sorteios 42 e 43.
name: svm_disc_md_pf_res160_on_b
method: autoencoder
runner: eval
grid:
  datasets: [Eggs]
  splits: [1]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_pf_res160_on_b
  results_csv: /exps/moliveira/results_sol/pool_foco/svm_disc_md_pf_res160_on_b
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [160]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0.5], g: [1], foco: 400}
    fontes: /exps/moliveira/fontes_filtros/pf_res160_on_b
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    entre_camadas: true
    methods: [fpsw@mapa_w0.5_1]
    controls: [random_z, orth]
    twin_controls: [random_z, orth]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 1
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_pf_res160_on_b
skip: state
