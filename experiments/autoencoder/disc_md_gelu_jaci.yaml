# GELU contra ReLU no melhor modelo (pedido de 08/11): receita sol_wsal (L6 cat, 256, whitening entre camadas) com a ativacao de toda camada trocada; controles aleatorios puros com a mesma ativacao.
# Whitening entre camadas + saliencia gmr (peso na selecao e foco dos superpixels), juntos pela primeira vez; 12 bases, sem mascara real.
name: svm_disc_md_gelu
method: autoencoder
runner: eval
grid:
  datasets: [Larvae, Eggs, Protozoan, aid, flowers, remote_sensing]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_gelu
  results_csv: results/svm_disc_md_gelu
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0.5], g: [1], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/gelu
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    ativacao: [relu, gelu]
    controls: [orth, random_z]
    twin_controls: [random_z]
resources:
  gpu_ids: [0]
  max_per_gpu: 8
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_gelu
skip: state
