# Ponto de partida do estudo SSL (A_reports/november/ssl_exploracao/contexto_comum.md): o melhor SPiFiL pequeno de remote_sensing
# (40-80-152-152-152-312 k3, 0,98 M params, pools 2-2-2-2-1-1, 200 px, fps) e o random_z da MESMA forma, montados
# pelo spf_grade com o protocolo de disc_md_restr5m_k3_cena_jaci.yaml e salvos em formato FLIM (amostra.salvar_encoder).
# Um YAML por base: salvar_encoder grava em <dir>/<braco>/<dataset>_split<s>_pct<p>, sem a lei no caminho.
# Fontes: o cache de restr5m_k3_cena vale a 50% (mesmas fontes do CSV de referencia); 100% ganha as suas (sufixo _pct100).
# As linhas do CSV sao a epoca 0 (L0) dos runs SSL.
name: svm_hyb_ssl_encoder_remote_sensing_jaci
method: autoencoder
runner: eval
grid:
  datasets: [remote_sensing]
  splits: [1, 2, 3]
  percentages: [50, 100]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/hyb_ssl_encoder_remote_sensing
  results_csv: results/svm_hyb_ssl_encoder_remote_sensing_jaci
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/restr5m_k3_cena
    salvar_encoder: /dados/home/moliveira/exps/encoders/ssl_pequeno/remote_sensing
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [0]
    kernels: [3]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    tta: true
    methods: [fps]
    controls: [random_z]
    twin_controls: []  # no restr5m a largura real sempre bateu com a pedida; um twin colidiria no mesmo diretorio random_z/
    leis:
      - {lei: W, w: "40-80-152-152-152-312", depth: 6}
resources:
  gpu_ids: [0]
  max_per_gpu: 8   # GPU_CAP_MIB=4200 por processo
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/hyb_ssl_encoder_remote_sensing
skip: state
