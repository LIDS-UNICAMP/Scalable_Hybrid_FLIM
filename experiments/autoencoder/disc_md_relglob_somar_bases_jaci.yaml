# JACI. Mesmo protocolo de disc_md_relglob_somar.yaml (cat+mscp, cat+cov60; cada bloco PCA na metade + pw_whiten), agora em aid, ham10000 e coconut_trees:
# lei de cena ou caso isolado do remote_sensing? fps e fpsw@mapa_w0.5_1 rodam nas 3 (a receita le fps em aid, fpsw nas de objeto). random_z puro, sem mecanismo.
# 3 splits, 50%, so validacao. Lancar com GPU_CAP_MIB=4200.
name: svm_disc_md_relglob_somar_bases
method: autoencoder
runner: eval
grid:
  datasets: [aid, ham10000, coconut_trees]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth/disc_md_relglob_somar_bases
  results_csv: results/svm_disc_md_relglob_somar_bases
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    saliency:
      map: gmr
      cuts: [otsu]
      pesos: {t: [0, 0.5, 0.75], g: [1, 2], foco: 400}
    fontes: /dados/home/moliveira/exps/fontes_filtros/receita_tta
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42]
    widths: [256]
    kernels: [5]
    depth: 6
    pool: [2, 2, 2, 2, 1, 1]
    combo: {words: 512}
    entre_camadas: true
    methods: [fps, fpsw@mapa_w0.5_1]
    controls: [random_z]
    twin_controls: [random_z]
    leituras: [gem, cov60, mscp]
    somar: true
resources:
  gpu_ids: [0]
  max_per_gpu: 6
  cpus_per_experiment: 2
output:
  work_dir: /dados/home/moliveira/exps/eval/disc_md_relglob_somar_bases
skip: state
