# HAM10000 a 50%, receita fps. L0 = receita intacta, L6 = ultima epoca do LeJEPA, projetor descartado, leitura gem_cat_tta_pw, conjunto test. So depois do treino.
name: svm_hyb_receita_inteira_lejepa_ham50_fps_test_catttapw_jaci
method: autoencoder
runner: eval
grid:
  datasets: [ham10000]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  family: hyb_receita_inteira_ham50_fps_lejepa
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth
  ckpt_selection: best
  results_csv: results/svm_hyb_receita_inteira_lejepa_ham50_fps_test_catttapw_jaci.csv
  embed_mode: gem_cat_tta_pw
  eval_set: test
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  stages: [L0, L6]
resources:
  gpu_ids: [0]
  max_per_gpu: 1   # SVM um por vez (CPU satura)
  cpus_per_experiment: 8
output:
  work_dir: /dados/home/moliveira/exps/eval/svm_hyb_receita_inteira_lejepa_ham50_fps_test_catttapw
skip: state
