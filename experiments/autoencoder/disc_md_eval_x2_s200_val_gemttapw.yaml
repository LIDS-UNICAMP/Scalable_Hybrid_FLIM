# SVM de validacao de x2, 200 px: leitura final em L1. Rodar so depois do treino, um por vez.
name: svm_disc_md_eval_x2_s200_val_gemttapw
method: autoencoder
runner: eval
grid:
  datasets: [Eggs_subgroup, helminth_eggs]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  artifacts_dir: /exps/moliveira/spifil_growth
  family: disc_md_x2_*s200*
  ckpt_selection: best
  results_csv: results/svm_disc_md_eval_x2_s200_val_gemttapw.csv
  embed_mode: gem_tta_pw
  eval_set: val
  stages: [L1]
  image_size: 200
  no_crop: true
resources:
  gpu_ids: [1]
  max_per_gpu: 1
  cpus_per_experiment: 8
output:
  work_dir: /exps/moliveira/eval/disc_md_eval_x2_s200_val_gemttapw
skip: state
