# Saliencia sem rotulo como mascara e como peso, sobre cos, fps e sift_nms; flowers nao tem label, logo nao tem oraculo. Mapa pela regra interna de saliencia.md.
name: svm_disc_md_spf_sal_fl
method: autoencoder
runner: eval
grid:
  datasets: [flowers]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: spf_grade
  artifacts_dir: /exps/moliveira/spifil_growth/disc_md_spf_sal_fl
  results_csv: results/svm_disc_md_spf_sal_fl
  image_cache_dir: /exps/moliveira/image_cache
  no_crop: true
  l1_sizes: [200]
  l1_superpixels: [50]
  l1_readouts: [gem_pw]
  l1_grow:
    impurities: true
    superpixels: disf
    budget_check: false
  amostra:
    shards: 2
    svm_workers: 1
    images: 500
    draws: [42, 43]
    widths: [64, 256]
    kernels: [5]
    depth: 3
    pool: 2
    saliency: {map: gmr, cuts: [triangle, otsu, t0.75]}
    methods: [cos, fps, crus@sift_nms, cos@mapa_triangle, cos@mapa_otsu, cos@mapa_t0.75, cos@mapa_peso, fps@mapa_triangle, fps@mapa_otsu, fps@mapa_t0.75, fpsw@mapa_peso, crus@nms_triangle, crus@nms_otsu, crus@nms_t0.75, crus@nms_peso]
    controls: [random_z, orth, whrand]
    twin_controls: [random_z, orth, whrand]
resources:
  gpu_ids: [0, 1, 2, 3]
  max_per_gpu: 2
  cpus_per_experiment: 2
output:
  work_dir: /exps/moliveira/eval/disc_md_spf_sal_fl
skip: state
