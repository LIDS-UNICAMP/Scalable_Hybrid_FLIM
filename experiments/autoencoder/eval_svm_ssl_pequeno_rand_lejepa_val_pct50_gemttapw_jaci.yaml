# SVM do ssl_pequeno_rand_lejepa: L0 (encoder pequeno intacto) e L<n> (menor val_ssl_loss, sem rotulo; projetor descartado), leitura gem_tta_pw, conjunto val. So depois do treino.
name: svm_ssl_pequeno_rand_lejepa_val_pct50_gemttapw_jaci
method: autoencoder
runner: eval
grid:
  datasets: [Protozoan, Eggs, Larvae, ham10000, aid, remote_sensing, coconut_trees, flowers]
  splits: [1, 2, 3]
  percentages: [50]
runner_args:
  probe: svm
  source: growth_stages
  family: ssl_pequeno_rand_lejepa
  artifacts_dir: /dados/home/moliveira/exps/spifil_growth
  ckpt_selection: best
  results_csv: results/svm_ssl_pequeno_rand_lejepa_val_pct50_gemttapw_jaci.csv
  embed_mode: gem_tta_pw
  eval_set: val
  image_size: 200
  no_crop: true
  image_cache_dir: /dados/home/moliveira/exps/image_cache
  stages: [L0, L2, L3, L4, L5, L6]
resources:
  gpu_ids: [0]
  max_per_gpu: 1   # SVM um por vez (CPU satura)
  cpus_per_experiment: 8
output:
  work_dir: /dados/home/moliveira/exps/eval/svm_ssl_pequeno_rand_lejepa_val_pct50_gemttapw
skip: state
