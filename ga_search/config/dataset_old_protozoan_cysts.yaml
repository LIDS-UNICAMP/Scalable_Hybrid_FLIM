name: old_protozoan_cysts
layout: old
root: /dados/home/moliveira/Scalable_Hybrid_FLIM/data/to_modules/new_split_parasito/protozoan-cysts
images_dir: "{root}/images"
masks_dir: "{root}/masks"
split_json: "{root}/splits_incremental/split{split}/data_descriptor_perc{pct}.json"
train_key: train
# Avaliacao so com treino e validacao: o teste nunca entra na busca. Na old_version
# 'validation' = pool - treino, entao muda com a pct, e em perc100 e igual ao treino; o
# evaluate.py tira da avaliacao as imagens de onde os filtros foram recortados.
eval:
  source: validation
pcts: [1, 5, 25, 50, 75, 100]
splits: [1, 2, 3]
# numeração ANTIGA (eval/constants.py; confere com organized/protozoan_cysts/manifest.json).
# Grafia sem trema em Iodamoeba, igual à organized, para os nomes baterem entre versões.
classes: {1: Entamoeba coli, 2: Entamoeba histolytica, 3: Endolimax nana, 4: Giardia intestinalis, 5: Iodamoeba butschlii, 6: Blastocystis hominis, 7: Impurities}
n_classes: 7
impurity_class: Impurities
paper_classes: [Entamoeba coli, Entamoeba histolytica, Endolimax nana, Giardia intestinalis, Iodamoeba butschlii, Blastocystis hominis]
has_mask: true
native_size: 200
image_ext: png
search_space_overrides: {}
