paper_classes: [Ancylostoma, Ascaris lumbricoides, Enterobius vermicularis, Hymenolepis diminuta, Hymenolepis nana, Schistosoma mansoni, Taenia spp, Trichuris trichiura]
has_mask: true
native_size: 200
image_ext: png
search_space_overrides: {}
