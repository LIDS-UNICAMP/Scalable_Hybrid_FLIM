name: old_helminth_eggs
layout: old
root: /dados/home/moliveira/Scalable_Hybrid_FLIM/data/to_modules/new_split_parasito/helminth-eggs
images_dir: "{root}/images"
masks_dir: "{root}/masks"
split_json: "{root}/splits_incremental/split{split}/data_descriptor_perc{pct}.json"
train_key: train
# Avaliacao so com treino e validacao: o teste nunca entra na busca. Na old_version
# 'validation' = pool - treino, entao muda com a pct, e em perc100 e igual ao treino; o
# evaluate.py tira da avaliacao as imagens de onde os filtros foram recortados.
eval:
  source: validation
pcts: [1, 5, 25, 50, 75, 100]
splits: [1, 2, 3]
# numeração ANTIGA (eval/constants.py; confere com organized/helminth_eggs/manifest.json)
classes: {1: Hymenolepis nana, 2: Hymenolepis diminuta, 3: Ancylostoma, 4: Enterobius vermicularis, 5: Ascaris lumbricoides, 6: Trichuris trichiura, 7: Schistosoma mansoni, 8: Taenia spp, 9: Impurities}
n_classes: 9
impurity_class: Impurities
paper_classes: [Hymenolepis nana, Hymenolepis diminuta, Ancylostoma, Enterobius vermicularis, Ascaris lumbricoides, Trichuris trichiura, Schistosoma mansoni, Taenia spp]
has_mask: true
native_size: 200
image_ext: png
search_space_overrides: {}
